services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
    ports:
      - "${POSTGRES_BIND_HOST:-0.0.0.0}:${POSTGRES_PUBLIC_PORT:-15432}:5432"
    volumes:
      - slan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PUBLIC_PORT:-16379}:6379"
    volumes:
      - slan-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bifromq:
    image: apache/bifromq:${BIFROMQ_VERSION:-4.0.0-incubating}
    platform: linux/amd64
    hostname: bifromq
    mem_limit: "${BIFROMQ_MEM_LIMIT:-1g}"
    environment:
      MEM_LIMIT: "${BIFROMQ_MEM_LIMIT_BYTES:-1073741824}"
      EXTRA_JVM_OPTS: "-XX:MaxRAMPercentage=${BIFROMQ_MAX_RAM_PERCENTAGE:-45} -XX:InitialRAMPercentage=${BIFROMQ_INITIAL_RAM_PERCENTAGE:-20} -Dplugin.authprovider.url=${BIFROMQ_AUTH_PROVIDER_URL:-http://server-biz:8080/mqtt/bifromq}"
    ports:
      - "${BIFROMQ_MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/local/bifromq/standalone.yml:/home/bifromq/conf/standalone.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 20

  server-biz:
    image: slan-service-biz:latest
    build:
      context: ./server/service-biz
      dockerfile: Dockerfile
    environment:
      SLAN_BIZ_ADDR: ":8080"
      SLAN_BIZ_ROUTE_SET: "all"
      SLAN_OPS_DEFAULT_ADMIN_EMAIL: "${SLAN_OPS_DEFAULT_ADMIN_EMAIL:-admin1}"
      SLAN_OPS_DEFAULT_ADMIN_PASSWORD: "${SLAN_OPS_DEFAULT_ADMIN_PASSWORD:-admin1}"
      SLAN_AUDIT_RETENTION_DAYS: "${SLAN_AUDIT_RETENTION_DAYS:-0}"
      SLAN_TRUSTED_PROXY_CIDRS: "${SLAN_TRUSTED_PROXY_CIDRS:-}"
      SLAN_DEVICE_ACCESS_TOKEN_TTL: "${SLAN_DEVICE_ACCESS_TOKEN_TTL:-2h}"
      SLAN_DEVICE_REFRESH_SHORT_TTL: "${SLAN_DEVICE_REFRESH_SHORT_TTL:-720h}"
      SLAN_DEVICE_REFRESH_LONG_TTL: "${SLAN_DEVICE_REFRESH_LONG_TTL:-4320h}"
      SLAN_DEVICE_REFRESH_MANUAL_TTL: "${SLAN_DEVICE_REFRESH_MANUAL_TTL:-8760h}"
      SLAN_OPS_SESSION_TTL: "${SLAN_OPS_SESSION_TTL:-24h}"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_MQTT_ENABLED: "${SLAN_MQTT_ENABLED:-true}"
      SLAN_MQTT_BROKER_URL: "${SLAN_MQTT_BROKER_URL:-mqtt://bifromq:1883}"
      SLAN_MQTT_PUBLIC_BROKER_URL: "${SLAN_MQTT_PUBLIC_BROKER_URL:-mqtt://127.0.0.1:1883}"
      SLAN_MQTT_PASSWORD_SECRET: "${SLAN_MQTT_PASSWORD_SECRET:-slan-dev-secret}"
      SLAN_RELAY_ENDPOINTS: "${SLAN_RELAY_ENDPOINTS:-}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_PUBLIC_UDP_PORT:-29110}"
      SLAN_WIRE_PUNCH_NODES: "${SLAN_WIRE_PUNCH_NODES:-}"
      SLAN_SERVICE_BIZ_DB_HOST: postgres
      SLAN_SERVICE_BIZ_DB_PORT: 5432
      SLAN_SERVICE_BIZ_DB_USER: postgres
      SLAN_SERVICE_BIZ_DB_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
      SLAN_SERVICE_BIZ_DB_NAME: slan
      SLAN_SERVICE_BIZ_DB_SSLMODE: disable
      SLAN_SERVICE_BIZ_DB_TIMEZONE: UTC
      SLAN_CLIENT_LOG_DIR: /var/lib/slan/client-logs
    ports:
      - "${SLAN_BIZ_PUBLIC_PORT:-28080}:8080"
    volumes:
      - slan-client-logs:/var/lib/slan/client-logs
    depends_on:
      postgres:
        condition: service_healthy

  server-biz-ops:
    image: slan-service-biz:latest
    build:
      context: ./server/service-biz
      dockerfile: Dockerfile
    environment:
      SLAN_BIZ_ADDR: ":8080"
      SLAN_BIZ_ROUTE_SET: "ops"
      SLAN_OPS_DEFAULT_ADMIN_EMAIL: "${SLAN_OPS_DEFAULT_ADMIN_EMAIL:-admin1}"
      SLAN_OPS_DEFAULT_ADMIN_PASSWORD: "${SLAN_OPS_DEFAULT_ADMIN_PASSWORD:-admin1}"
      SLAN_AUDIT_RETENTION_DAYS: "${SLAN_AUDIT_RETENTION_DAYS:-0}"
      SLAN_TRUSTED_PROXY_CIDRS: "${SLAN_TRUSTED_PROXY_CIDRS:-}"
      SLAN_DEVICE_ACCESS_TOKEN_TTL: "${SLAN_DEVICE_ACCESS_TOKEN_TTL:-2h}"
      SLAN_DEVICE_REFRESH_SHORT_TTL: "${SLAN_DEVICE_REFRESH_SHORT_TTL:-720h}"
      SLAN_DEVICE_REFRESH_LONG_TTL: "${SLAN_DEVICE_REFRESH_LONG_TTL:-4320h}"
      SLAN_DEVICE_REFRESH_MANUAL_TTL: "${SLAN_DEVICE_REFRESH_MANUAL_TTL:-8760h}"
      SLAN_OPS_SESSION_TTL: "${SLAN_OPS_SESSION_TTL:-24h}"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_MQTT_ENABLED: "${SLAN_MQTT_ENABLED:-true}"
      SLAN_MQTT_BROKER_URL: "${SLAN_MQTT_BROKER_URL:-mqtt://bifromq:1883}"
      SLAN_MQTT_PUBLIC_BROKER_URL: "${SLAN_MQTT_PUBLIC_BROKER_URL:-mqtt://127.0.0.1:1883}"
      SLAN_MQTT_PASSWORD_SECRET: "${SLAN_MQTT_PASSWORD_SECRET:-slan-dev-secret}"
      SLAN_RELAY_ENDPOINTS: "${SLAN_RELAY_ENDPOINTS:-}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_PUBLIC_UDP_PORT:-29110}"
      SLAN_WIRE_PUNCH_NODES: "${SLAN_WIRE_PUNCH_NODES:-}"
      SLAN_SERVICE_BIZ_DB_HOST: postgres
      SLAN_SERVICE_BIZ_DB_PORT: 5432
      SLAN_SERVICE_BIZ_DB_USER: postgres
      SLAN_SERVICE_BIZ_DB_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
      SLAN_SERVICE_BIZ_DB_NAME: slan
      SLAN_SERVICE_BIZ_DB_SSLMODE: disable
      SLAN_SERVICE_BIZ_DB_TIMEZONE: UTC
    ports:
      - "${SLAN_BIZ_OPS_PUBLIC_PORT:-28082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  server-wire:
    build:
      context: ./server/server-wire
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_LISTEN_ADDR: ":29100"
      SLAN_WIRE_BIZ_INTERNAL_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_WIRE_POSTGRES_DSN: "postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/slan?sslmode=disable"
    ports:
      - "${SLAN_WIRE_PORT:-29100}:29100"
    depends_on:
      postgres:
        condition: service_healthy
      server-biz:
        condition: service_started

  server-wire-b:
    build:
      context: ./server/server-wire
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_LISTEN_ADDR: ":29100"
      SLAN_WIRE_BIZ_INTERNAL_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_WIRE_POSTGRES_DSN: "postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/slan?sslmode=disable"
    ports:
      - "${SLAN_WIRE_B_PORT:-29101}:29100"
    depends_on:
      postgres:
        condition: service_healthy
      server-biz:
        condition: service_started

  server-wire-relay:
    build:
      context: ./server/server-wire-relay
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_RELAY_LISTEN_ADDR: ":29110"
      SLAN_WIRE_RELAY_ADMIN_LISTEN_ADDR: ":29111"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_RELAY_REGION_ID: "${SLAN_WIRE_RELAY_REGION_ID:-local}"
      SLAN_WIRE_RELAY_NODE_ID: "${SLAN_WIRE_RELAY_NODE_ID:-relay-local}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_PORT:-29110}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_RELAY_PORT:-29110}:29110/udp"
      - "${SLAN_WIRE_RELAY_ADMIN_PORT:-29111}:29111"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-relay-b:
    build:
      context: ./server/server-wire-relay
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_RELAY_LISTEN_ADDR: ":29110"
      SLAN_WIRE_RELAY_ADMIN_LISTEN_ADDR: ":29111"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_RELAY_REGION_ID: "${SLAN_WIRE_RELAY_B_REGION_ID:-local}"
      SLAN_WIRE_RELAY_NODE_ID: "${SLAN_WIRE_RELAY_B_NODE_ID:-relay-local-b}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_B_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_B_PUBLIC_UDP_PORT:-29112}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_RELAY_B_PORT:-29112}:29110/udp"
      - "${SLAN_WIRE_RELAY_B_ADMIN_PORT:-29113}:29111"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-punch:
    build:
      context: ./server/server-wire-punch
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_PUNCH_LISTEN_ADDR: ":29130"
      SLAN_WIRE_PUNCH_HTTP_LISTEN_ADDR: ":29131"
      SLAN_WIRE_PUNCH_PUBLIC_HOST: "${SLAN_WIRE_PUNCH_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_PUNCH_PUBLIC_UDP_PORT: "${SLAN_WIRE_PUNCH_PORT:-29130}"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
    ports:
      - "${SLAN_WIRE_PUNCH_PORT:-29130}:29130/udp"
      - "${SLAN_WIRE_PUNCH_HTTP_PORT:-29131}:29131"
    depends_on:
      server-biz:
        condition: service_started

  server-wire-derp:
    build:
      context: ./server/server-wire-derp
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_DERP_LISTEN_ADDR: ":29120"
      SLAN_WIRE_DERP_ADMIN_LISTEN_ADDR: ":29121"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_DERP_REGION_ID: "${SLAN_WIRE_DERP_REGION_ID:-local}"
      SLAN_WIRE_DERP_NODE_ID: "${SLAN_WIRE_DERP_NODE_ID:-derp-local}"
      SLAN_WIRE_DERP_PUBLIC_HOST: "${SLAN_WIRE_DERP_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_DERP_PUBLIC_PORT: "${SLAN_WIRE_DERP_PUBLIC_PORT:-29120}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_DERP_PORT:-29120}:29120"
      - "${SLAN_WIRE_DERP_ADMIN_PORT:-29121}:29121"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-derp-b:
    build:
      context: ./server/server-wire-derp
      dockerfile: Dockerfile
    environment:
      SLAN_WIRE_DERP_LISTEN_ADDR: ":29120"
      SLAN_WIRE_DERP_ADMIN_LISTEN_ADDR: ":29121"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_DERP_REGION_ID: "${SLAN_WIRE_DERP_B_REGION_ID:-local}"
      SLAN_WIRE_DERP_NODE_ID: "${SLAN_WIRE_DERP_B_NODE_ID:-derp-local-b}"
      SLAN_WIRE_DERP_PUBLIC_HOST: "${SLAN_WIRE_DERP_B_PUBLIC_HOST:-47.245.40.231}"
      SLAN_WIRE_DERP_PUBLIC_PORT: "${SLAN_WIRE_DERP_B_PUBLIC_PORT:-29122}"
      SLAN_RELAY_TICKET_SECRET: "${SLAN_RELAY_TICKET_SECRET:-change-me-relay-ticket-secret}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_DERP_B_PORT:-29122}:29120"
      - "${SLAN_WIRE_DERP_B_ADMIN_PORT:-29123}:29121"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  opt-ui:
    image: slan-opt-ui:latest
    build:
      context: ./server/opt-ui
      dockerfile: Dockerfile
    ports:
      - "${SLAN_MAIN_PORT:-24201}:80"
    depends_on:
      server-biz-ops:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - slan-caddy-data:/data
      - slan-caddy-config:/config
    depends_on:
      server-biz:
        condition: service_started
      server-biz-ops:
        condition: service_started
      opt-ui:
        condition: service_started

volumes:
  slan-postgres-data:
  slan-redis-data:
  slan-client-logs:
  slan-caddy-data:
  slan-caddy-config:
