services:
  postgres:
    image: postgres:16-alpine
    container_name: slan-postgres
    environment:
      POSTGRES_DB: slan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
    ports:
      - "${POSTGRES_BIND_HOST:-0.0.0.0}:${POSTGRES_PUBLIC_PORT:-15432}:5432"
    volumes:
      - slan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: slan-redis
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PUBLIC_PORT:-16379}:6379"
    volumes:
      - slan-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bifromq:
    image: apache/bifromq:${BIFROMQ_VERSION:-4.0.0-incubating}
    container_name: slan-bifromq
    mem_limit: "${BIFROMQ_MEM_LIMIT:-2g}"
    environment:
      MEM_LIMIT: "${BIFROMQ_MEM_LIMIT_BYTES:-2147483648}"
      EXTRA_JVM_OPTS: "-Dplugin.authprovider.url=${BIFROMQ_AUTH_PROVIDER_URL:-http://server-biz:8080/mqtt/bifromq}"
    ports:
      - "${BIFROMQ_MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/local/bifromq/standalone.yml:/home/bifromq/conf/standalone.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 20

  server-biz:
    build:
      context: ./server/server-biz
      dockerfile: Dockerfile
    container_name: slan-server-biz
    command: ["-config", "/app/config.yaml"]
    environment:
      SLAN_HTTP_PUBLIC_HOST: "${SLAN_HTTP_PUBLIC_HOST:-slan.localhost:18443}"
      SLAN_HTTP_PUBLIC_SCHEME: "${SLAN_HTTP_PUBLIC_SCHEME:-https}"
      SLAN_RELAY_TICKET_SIGNING_SECRET: "${SLAN_RELAY_TICKET_SIGNING_SECRET:-change-me-relay-ticket-secret}"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_NODE_HEARTBEAT_FRESHNESS_SECONDS: "${SLAN_WIRE_NODE_HEARTBEAT_FRESHNESS_SECONDS:-120}"
      SLAN_WIRE_NODE_CLEANUP_INTERVAL_SECONDS: "${SLAN_WIRE_NODE_CLEANUP_INTERVAL_SECONDS:-60}"
      SLAN_WIRE_NODE_EVENT_RETENTION_SECONDS: "${SLAN_WIRE_NODE_EVENT_RETENTION_SECONDS:-604800}"
      SLAN_MQTT_ENABLED: "${SLAN_MQTT_ENABLED:-true}"
      SLAN_MQTT_BROKER_URL: "${SLAN_MQTT_BROKER_URL:-mqtt://bifromq:1883}"
      SLAN_MQTT_PUBLIC_BROKER_URL: "${SLAN_MQTT_PUBLIC_BROKER_URL:-mqtt://127.0.0.1:1883}"
      SLAN_MQTT_PASSWORD_SECRET: "${SLAN_MQTT_PASSWORD_SECRET:-change-me-mqtt-secret}"
      SLAN_OPS_ACCESS_TOKEN: "${SLAN_OPS_ACCESS_TOKEN:-change-me-ops-token}"
      SLAN_OPS_DEFAULT_ADMIN_PASSWORD: "${SLAN_OPS_DEFAULT_ADMIN_PASSWORD:-admin}"
      SLAN_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
    ports:
      - "${SLAN_BIZ_PUBLIC_PORT:-28080}:8080"
      - "${SLAN_BIZ_OPS_PORT:-28081}:8081"
    volumes:
      - ./server/server-biz/configs/config.docker.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifromq:
        condition: service_healthy

  ice-server:
    build:
      context: ./server/server-biz
      dockerfile: Dockerfile
      args:
        APP_TARGET: ice-server
    container_name: slan-ice-server
    command: ["-config", "/app/config.yaml"]
    environment:
      SLAN_MQTT_ENABLED: "${SLAN_MQTT_ENABLED:-true}"
      SLAN_MQTT_PASSWORD_SECRET: "${SLAN_MQTT_PASSWORD_SECRET:-change-me-mqtt-secret}"
      SLAN_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres-password}"
      SLAN_ICE_BIND_ADDRESS: ":3478"
      SLAN_ICE_SERVER_ID: "${SLAN_ICE_SERVER_ID:-ice-local-udp}"
    ports:
      - "${SLAN_ICE_PORT:-13478}:3478/udp"
    volumes:
      - ./server/server-biz/configs/config.docker.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  server-wire:
    build:
      context: ./server/server-wire
      dockerfile: Dockerfile
    container_name: slan-server-wire
    environment:
      SLAN_WIRE_LISTEN_ADDR: ":29100"
      SLAN_WIRE_BIZ_INTERNAL_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_WIRE_POSTGRES_DSN: "postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/slan?sslmode=disable"
    ports:
      - "${SLAN_WIRE_PORT:-29100}:29100"
    depends_on:
      postgres:
        condition: service_healthy
      server-biz:
        condition: service_started

  server-wire-b:
    build:
      context: ./server/server-wire
      dockerfile: Dockerfile
    container_name: slan-server-wire-b
    environment:
      SLAN_WIRE_LISTEN_ADDR: ":29100"
      SLAN_WIRE_BIZ_INTERNAL_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
      SLAN_WIRE_POSTGRES_DSN: "postgres://postgres:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/slan?sslmode=disable"
    ports:
      - "${SLAN_WIRE_B_PORT:-29101}:29100"
    depends_on:
      postgres:
        condition: service_healthy
      server-biz:
        condition: service_started

  server-wire-relay:
    build:
      context: ./server/server-wire-relay
      dockerfile: Dockerfile
    container_name: slan-server-wire-relay
    environment:
      SLAN_WIRE_RELAY_LISTEN_ADDR: ":29110"
      SLAN_WIRE_RELAY_ADMIN_LISTEN_ADDR: ":29111"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_RELAY_REGION_ID: "${SLAN_WIRE_RELAY_REGION_ID:-local}"
      SLAN_WIRE_RELAY_NODE_ID: "${SLAN_WIRE_RELAY_NODE_ID:-relay-local}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_PUBLIC_HOST:-127.0.0.1}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_PORT:-29110}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_RELAY_PORT:-29110}:29110/udp"
      - "${SLAN_WIRE_RELAY_ADMIN_PORT:-29111}:29111"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-relay-b:
    build:
      context: ./server/server-wire-relay
      dockerfile: Dockerfile
    container_name: slan-server-wire-relay-b
    environment:
      SLAN_WIRE_RELAY_LISTEN_ADDR: ":29110"
      SLAN_WIRE_RELAY_ADMIN_LISTEN_ADDR: ":29111"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_RELAY_REGION_ID: "${SLAN_WIRE_RELAY_B_REGION_ID:-local}"
      SLAN_WIRE_RELAY_NODE_ID: "${SLAN_WIRE_RELAY_B_NODE_ID:-relay-local-b}"
      SLAN_WIRE_RELAY_PUBLIC_HOST: "${SLAN_WIRE_RELAY_B_PUBLIC_HOST:-127.0.0.1}"
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: "${SLAN_WIRE_RELAY_B_PUBLIC_UDP_PORT:-29110}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_RELAY_B_ADMIN_PORT:-29113}:29111"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-derp:
    build:
      context: ./server/server-wire-derp
      dockerfile: Dockerfile
    container_name: slan-server-wire-derp
    environment:
      SLAN_WIRE_DERP_LISTEN_ADDR: ":29120"
      SLAN_WIRE_DERP_ADMIN_LISTEN_ADDR: ":29121"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_DERP_REGION_ID: "${SLAN_WIRE_DERP_REGION_ID:-local}"
      SLAN_WIRE_DERP_NODE_ID: "${SLAN_WIRE_DERP_NODE_ID:-derp-local}"
      SLAN_WIRE_DERP_PUBLIC_HOST: "${SLAN_WIRE_DERP_PUBLIC_HOST:-127.0.0.1}"
      SLAN_WIRE_DERP_PUBLIC_PORT: "${SLAN_WIRE_DERP_PUBLIC_PORT:-443}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_DERP_PORT:-29120}:29120"
      - "${SLAN_WIRE_DERP_ADMIN_PORT:-29121}:29121"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-wire-derp-b:
    build:
      context: ./server/server-wire-derp
      dockerfile: Dockerfile
    container_name: slan-server-wire-derp-b
    environment:
      SLAN_WIRE_DERP_LISTEN_ADDR: ":29120"
      SLAN_WIRE_DERP_ADMIN_LISTEN_ADDR: ":29121"
      SLAN_BIZ_URL: "http://server-biz:8080"
      SLAN_INTERNAL_WIRE_TOKEN: "${SLAN_INTERNAL_WIRE_TOKEN:-change-me-wire-internal-token}"
      SLAN_WIRE_DERP_REGION_ID: "${SLAN_WIRE_DERP_B_REGION_ID:-local}"
      SLAN_WIRE_DERP_NODE_ID: "${SLAN_WIRE_DERP_B_NODE_ID:-derp-local-b}"
      SLAN_WIRE_DERP_PUBLIC_HOST: "${SLAN_WIRE_DERP_B_PUBLIC_HOST:-127.0.0.1}"
      SLAN_WIRE_DERP_PUBLIC_PORT: "${SLAN_WIRE_DERP_B_PUBLIC_PORT:-443}"
      SLAN_WIRE_TICKET_SECRET: "${SLAN_WIRE_TICKET_SECRET:-change-me-wire-ticket-secret}"
      SLAN_WIRE_TICKET_SECRETS: "${SLAN_WIRE_TICKET_SECRETS:-change-me-wire-ticket-secret}"
    ports:
      - "${SLAN_WIRE_DERP_B_ADMIN_PORT:-29123}:29121"
    depends_on:
      server-biz:
        condition: service_started
      server-wire:
        condition: service_started

  server-ui-web:
    build:
      context: ./server/server-ui/web
      dockerfile: Dockerfile
    container_name: slan-server-ui-web
    ports:
      - "${SLAN_WEB_PORT:-24200}:80"
    depends_on:
      server-biz:
        condition: service_started

  server-main:
    build:
      context: ./server/server-main
      dockerfile: Dockerfile
    container_name: slan-server-main
    ports:
      - "${SLAN_MAIN_PORT:-24201}:80"
    depends_on:
      server-biz:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: slan-caddy
    ports:
      - "18443:443"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - slan-caddy-data:/data
      - slan-caddy-config:/config
    depends_on:
      server-biz:
        condition: service_started
      server-ui-web:
        condition: service_started
      server-main:
        condition: service_started

volumes:
  slan-postgres-data:
  slan-redis-data:
  slan-caddy-data:
  slan-caddy-config:
