# SLAN EMQX broker configuration (HOCON).
#
# Authentication and authorization are delegated to service-biz over HTTP,
# mirroring the previous BifroMQ auth provider integration:
#   POST /mqtt/emqx/auth  -> {"result":"allow"|"deny", "is_superuser":bool}
#   POST /mqtt/emqx/check -> {"result":"allow"|"deny"}
#
# The auth/ACL endpoint URLs are not set here: EMQX's ${VAR} substitution does
# not cover authorization.source URLs, so docker-compose overrides them via
# EMQX_AUTHENTICATION__1__URL / EMQX_AUTHORIZATION__SOURCES__1__URL.
# The ${SLAN_MQTT_WEBHOOK_TOKEN} placeholder below is NOT expanded by EMQX;
# deployment scripts must substitute it with the real token from .env
# (e.g. sed -i "s|\${SLAN_MQTT_WEBHOOK_TOKEN}|$TOKEN|g" emqx.conf) before
# starting the stack. service-biz validates the same webhook token from the
# X-Slan-MQTT-Webhook-Token header; leave the token empty for local
# development only.

node {
  # Required fields: a mounted emqx.conf fully replaces the image default,
  # so data_dir and cookie must be declared here. emqx.conf does not expand
  # ${VAR}, so the per-environment cookie is overridden via EMQX_NODE__COOKIE.
  data_dir = "/opt/emqx/data"
  cookie = "slan-emqx-default-cookie"
}

authentication = [
  {
    enable = true
    mechanism = password_based
    backend = http
    method = post
    url = "http://server-biz:8080/mqtt/emqx/auth"
    headers {
      content-type = "application/json"
      x-slan-mqtt-webhook-token = "${SLAN_MQTT_WEBHOOK_TOKEN}"
    }
    body {
      # JSON keys follow service-biz's webhook decoder (clientId); the
      # placeholders on the right are EMQX runtime placeholders (lowercase).
      clientId = "${clientid}"
      username = "${username}"
      password = "${password}"
      peerhost = "${peerhost}"
    }
    connect_timeout = "5s"
    request_timeout = "10s"
    enable_pipelining = 1
    ssl { enable = false }
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 64
    ttl = "60s"
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://server-biz:8080/mqtt/emqx/check"
      headers {
        content-type = "application/json"
        x-slan-mqtt-webhook-token = "${SLAN_MQTT_WEBHOOK_TOKEN}"
      }
      body {
        clientId = "${clientid}"
        username = "${username}"
        action = "${action}"
        topic = "${topic}"
        peerhost = "${peerhost}"
        mountpoint = "${mountpoint}"
      }
      connect_timeout = "5s"
      request_timeout = "10s"
      pool_size = 8
      ssl { enable = false }
    }
  ]
}

listeners {
  tcp {
    default {
      bind = "0.0.0.0:1883"
    }
  }
  ssl {
    default {
      # TLS listener for production mqtts:// access. Mount certificates and
      # set enable = true (or override via EMQX_LISTENERS__SSL__DEFAULT__*)
      # when exposing SLAN_MQTT_PUBLIC_BROKER_URL over TLS.
      enable = false
      bind = "0.0.0.0:8883"
    }
  }
  ws {
    default {
      bind = "0.0.0.0:8083"
      websocket {
        mqtt_path = "/mqtt"
      }
    }
  }
}

mqtt {
  max_packet_size = "512KB"
}

dashboard {
  listeners {
    http {
      bind = "0.0.0.0:18083"
    }
  }
}
