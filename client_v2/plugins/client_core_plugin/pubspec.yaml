name: client_core_plugin
description: Platform bridge facade for SLAN client core v2.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.slan.client_core_plugin
        pluginClass: ClientCorePlugin
      ios:
        dartPluginClass: ClientCorePlugin
      linux:
        dartPluginClass: ClientCorePlugin
      macos:
        pluginClass: ClientCorePlugin
      windows:
        pluginClass: ClientCorePlugin
