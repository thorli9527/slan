name: slan-biz

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SLAN_BIZ_DB_NAME:-slan}
      POSTGRES_USER: ${SLAN_BIZ_DB_USER:-slan}
      POSTGRES_PASSWORD: ${SLAN_BIZ_DB_PASSWORD:-slan}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SLAN_BIZ_DB_USER:-slan} -d ${SLAN_BIZ_DB_NAME:-slan}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - slan-biz-postgres:/var/lib/postgresql/data

  server-biz:
    image: slan-service-biz:latest
    build:
      context: ./server/service-biz
      dockerfile: Dockerfile
    environment:
      SLAN_BIZ_ADDR: ":8080"
      SLAN_BIZ_ROUTE_SET: "all"
      SLAN_ENV: ${SLAN_ENV:-development}
      SLAN_DEVICE_CREDENTIAL_PEPPER: ${SLAN_DEVICE_CREDENTIAL_PEPPER:-}
      SLAN_DEVICE_CREDENTIAL_PREVIOUS_PEPPERS: ${SLAN_DEVICE_CREDENTIAL_PREVIOUS_PEPPERS:-}
      SLAN_MQTT_PASSWORD_SECRET: ${SLAN_MQTT_PASSWORD_SECRET:-}
      SLAN_MQTT_PUBLIC_BROKER_URL: ${SLAN_MQTT_PUBLIC_BROKER_URL:-}
      SLAN_INTERNAL_WIRE_TOKEN: ${SLAN_INTERNAL_WIRE_TOKEN:-}
      SLAN_MQTT_WEBHOOK_TOKEN: ${SLAN_MQTT_WEBHOOK_TOKEN:-}
      SLAN_OPS_DEFAULT_ADMIN_EMAIL: ${SLAN_OPS_DEFAULT_ADMIN_EMAIL:-admin@slan.local}
      SLAN_OPS_DEFAULT_ADMIN_PASSWORD: ${SLAN_OPS_DEFAULT_ADMIN_PASSWORD:-}
      SLAN_AUDIT_RETENTION_DAYS: ${SLAN_AUDIT_RETENTION_DAYS:-0}
      SLAN_TRUSTED_PROXY_CIDRS: ${SLAN_TRUSTED_PROXY_CIDRS:-}
      SLAN_DEVICE_ACCESS_TOKEN_TTL: ${SLAN_DEVICE_ACCESS_TOKEN_TTL:-2h}
      SLAN_DEVICE_REFRESH_SHORT_TTL: ${SLAN_DEVICE_REFRESH_SHORT_TTL:-720h}
      SLAN_DEVICE_REFRESH_LONG_TTL: ${SLAN_DEVICE_REFRESH_LONG_TTL:-4320h}
      SLAN_DEVICE_REFRESH_MANUAL_TTL: ${SLAN_DEVICE_REFRESH_MANUAL_TTL:-8760h}
      SLAN_OPS_SESSION_TTL: ${SLAN_OPS_SESSION_TTL:-24h}
      SLAN_SERVICE_BIZ_DB_HOST: postgres
      SLAN_SERVICE_BIZ_DB_PORT: 5432
      SLAN_SERVICE_BIZ_DB_USER: ${SLAN_BIZ_DB_USER:-slan}
      SLAN_SERVICE_BIZ_DB_PASSWORD: ${SLAN_BIZ_DB_PASSWORD:-slan}
      SLAN_SERVICE_BIZ_DB_NAME: ${SLAN_BIZ_DB_NAME:-slan}
      SLAN_SERVICE_BIZ_DB_SSLMODE: disable
      SLAN_SERVICE_BIZ_DB_TIMEZONE: UTC
      SLAN_RELAY_ENDPOINTS: ${SLAN_RELAY_ENDPOINTS:-}
      SLAN_WIRE_RELAY_PUBLIC_HOST: ${SLAN_WIRE_RELAY_PUBLIC_HOST:-}
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: ${SLAN_WIRE_RELAY_PUBLIC_UDP_PORT:-29110}
      SLAN_CLIENT_LOG_DIR: /var/lib/slan/client-logs
    ports:
      - "${SLAN_BIZ_APP_PORT:-39080}:8080"
    volumes:
      - slan-client-logs:/var/lib/slan/client-logs
    depends_on:
      postgres:
        condition: service_healthy

  server-biz-ops:
    image: slan-service-biz:latest
    build:
      context: ./server/service-biz
      dockerfile: Dockerfile
    environment:
      SLAN_BIZ_ADDR: ":8080"
      SLAN_BIZ_ROUTE_SET: "ops"
      SLAN_ENV: ${SLAN_ENV:-development}
      SLAN_DEVICE_CREDENTIAL_PEPPER: ${SLAN_DEVICE_CREDENTIAL_PEPPER:-}
      SLAN_DEVICE_CREDENTIAL_PREVIOUS_PEPPERS: ${SLAN_DEVICE_CREDENTIAL_PREVIOUS_PEPPERS:-}
      SLAN_MQTT_PASSWORD_SECRET: ${SLAN_MQTT_PASSWORD_SECRET:-}
      SLAN_MQTT_PUBLIC_BROKER_URL: ${SLAN_MQTT_PUBLIC_BROKER_URL:-}
      SLAN_INTERNAL_WIRE_TOKEN: ${SLAN_INTERNAL_WIRE_TOKEN:-}
      SLAN_MQTT_WEBHOOK_TOKEN: ${SLAN_MQTT_WEBHOOK_TOKEN:-}
      SLAN_OPS_DEFAULT_ADMIN_EMAIL: ${SLAN_OPS_DEFAULT_ADMIN_EMAIL:-admin@slan.local}
      SLAN_OPS_DEFAULT_ADMIN_PASSWORD: ${SLAN_OPS_DEFAULT_ADMIN_PASSWORD:-}
      SLAN_AUDIT_RETENTION_DAYS: ${SLAN_AUDIT_RETENTION_DAYS:-0}
      SLAN_TRUSTED_PROXY_CIDRS: ${SLAN_TRUSTED_PROXY_CIDRS:-}
      SLAN_DEVICE_ACCESS_TOKEN_TTL: ${SLAN_DEVICE_ACCESS_TOKEN_TTL:-2h}
      SLAN_DEVICE_REFRESH_SHORT_TTL: ${SLAN_DEVICE_REFRESH_SHORT_TTL:-720h}
      SLAN_DEVICE_REFRESH_LONG_TTL: ${SLAN_DEVICE_REFRESH_LONG_TTL:-4320h}
      SLAN_DEVICE_REFRESH_MANUAL_TTL: ${SLAN_DEVICE_REFRESH_MANUAL_TTL:-8760h}
      SLAN_OPS_SESSION_TTL: ${SLAN_OPS_SESSION_TTL:-24h}
      SLAN_SERVICE_BIZ_DB_HOST: postgres
      SLAN_SERVICE_BIZ_DB_PORT: 5432
      SLAN_SERVICE_BIZ_DB_USER: ${SLAN_BIZ_DB_USER:-slan}
      SLAN_SERVICE_BIZ_DB_PASSWORD: ${SLAN_BIZ_DB_PASSWORD:-slan}
      SLAN_SERVICE_BIZ_DB_NAME: ${SLAN_BIZ_DB_NAME:-slan}
      SLAN_SERVICE_BIZ_DB_SSLMODE: disable
      SLAN_SERVICE_BIZ_DB_TIMEZONE: UTC
      SLAN_RELAY_ENDPOINTS: ${SLAN_RELAY_ENDPOINTS:-}
      SLAN_WIRE_RELAY_PUBLIC_HOST: ${SLAN_WIRE_RELAY_PUBLIC_HOST:-}
      SLAN_WIRE_RELAY_PUBLIC_UDP_PORT: ${SLAN_WIRE_RELAY_PUBLIC_UDP_PORT:-29110}
    ports:
      - "${SLAN_BIZ_OPS_PORT:-39082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  opt-ui:
    image: slan-opt-ui:latest
    build:
      context: ./server/opt-ui
      dockerfile: Dockerfile
    ports:
      - "${SLAN_BIZ_OPT_UI_PORT:-24301}:80"
    depends_on:
      server-biz-ops:
        condition: service_started

volumes:
  slan-biz-postgres:
  slan-client-logs:
