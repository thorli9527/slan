name: build

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  wire-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/server-main/package-lock.json

      - name: Build server-main Angular app
        working-directory: server/server-main
        run: |
          npm ci
          npm run build

      - name: Start local wire stack
        run: docker compose -f docker-compose.local.yml up -d --build postgres redis bifromq server-biz server-wire server-wire-b server-wire-relay server-wire-relay-b server-wire-derp server-wire-derp-b

      - name: Run wire control-plane checks
        run: make wire-control-plane-check

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --tail=200

      - name: Stop local wire stack
        if: always()
        run: docker compose -f docker-compose.local.yml down
