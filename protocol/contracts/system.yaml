version: 1
slice: system
source_of_truth: server/server-biz/api/dto
contracts:
  ErrorResponse:
    fields:
      code:
        type: string
        required: true
      message:
        type: string
        required: true
  OpsRelayDataPlanePolicyRequest:
    fields:
      networkId:
        type: string
        required: true
      scope:
        type: string
        required: false
        comment: global / region / network / device / device_override。
      targetDeviceIds:
        type: string[]
        required: false
      pathType:
        type: string
        required: false
        comment: 可选路径维度，direct / p2p / relay / direct_udp / relay_udp / relay_tcp / relay_http3 / relay_tls；为空表示全部路径。
      preferredPathTypes:
        type: string[]
        required: false
        comment: 客户端路径优先级，例如 direct_udp, relay_udp, relay_tcp, relay_http3, relay_tls。
      policyId:
        type: string
        required: false
      version:
        type: int
        required: false
      recommendationLevel:
        type: int
        required: false
        comment: 服务端 12 级建议档位，范围 0..11。
      executionLevel:
        type: int
        required: false
        comment: 客户端 8 级执行档位，范围 0..7。
      relayMtu:
        type: int
        required: true
      maxFramePayload:
        type: int
        required: true
      reason:
        type: string
        required: false
      ttlMs:
        type: int64
        required: false
      effectiveMs:
        type: int64
        required: false
  OpsRelayDataPlanePolicyResponse:
    fields:
      policyId:
        type: string
        required: true
      networkId:
        type: string
        required: true
      scope:
        type: string
        required: false
      targetDeviceIds:
        type: string[]
        required: false
      pathType:
        type: string
        required: false
      preferredPathTypes:
        type: string[]
        required: false
      published:
        type: int
        required: true
      skipped:
        type: int
        required: true
      relayMtu:
        type: int
        required: true
      maxFramePayload:
        type: int
        required: true
      reason:
        type: string
        required: false
  OpsNetworkQualityItem:
    fields:
      healthId:
        type: string
        required: true
      networkId:
        type: string
        required: true
      deviceId:
        type: string
        required: false
      nodeId:
        type: string
        required: true
      pathType:
        type: string
        required: true
      activePath:
        type: string
        required: false
      relayMtu:
        type: int
        required: false
      maxFramePayload:
        type: int
        required: false
      policyId:
        type: string
        required: false
      policyScope:
        type: string
        required: false
      policyApplied:
        type: bool
        required: false
      policyReportedAtMs:
        type: int64
        required: false
      observedRttMs:
        type: int
        required: false
      packetLossPpm:
        type: int
        required: false
      pathScore:
        type: int
        required: false
      sourceCountryCode:
        type: string
        required: false
      relayCountryCode:
        type: string
        required: false
      peerCountryCode:
        type: string
        required: false
      crossCountry:
        type: bool
        required: false
      pathDowngrades:
        type: int64
        required: false
      pathUpgrades:
        type: int64
        required: false
      lastPathChange:
        type: string
        required: false
      sampledAtMs:
        type: int64
        required: false
        comment: 当前时间窗口内该客户端最新样本时间。
  OpsNetworkQuality:
    fields:
      items:
        type: OpsNetworkQualityItem[]
        required: false
        comment: 按客户端聚合后的当前时间窗口平均质量。
      summary:
        type: OpsNetworkQualitySummary
        required: true
  OpsNetworkQualitySummary:
    fields:
      networks:
        type: OpsNetworkQualityNetworkSummary[]
        required: false
  OpsNetworkQualityNetworkSummary:
    fields:
      networkId:
        type: string
        required: true
      hasCrossCountry:
        type: bool
        required: true
      crossCountry:
        type: OpsNetworkQualityCounter
        required: true
      nonCrossCountry:
        type: OpsNetworkQualityCounter
        required: true
      pathTypes:
        type: OpsNetworkQualityPathType[]
        required: false
      activePaths:
        type: OpsNetworkQualityPathType[]
        required: false
      pathDowngrades:
        type: int64
        required: false
      pathUpgrades:
        type: int64
        required: false
      countryPairs:
        type: OpsNetworkQualityCountryPair[]
        required: false
  OpsNetworkQualityCounter:
    fields:
