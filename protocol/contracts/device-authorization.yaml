version: 1
slice: device-authorization
source_of_truth: server/service-biz/internal/service
contracts:
  DeviceAuthorizationKeyExchangeRequest:
    fields:
      key:
        type: string
        required: true
      deviceId:
        type: string
        required: false
      platform:
        type: string
        required: true
      deviceVersion:
        type: string
        required: true
  DeviceSessionRenewRequest:
    fields:
      refreshToken:
        type: string
        required: true
      networkEnabled:
        type: bool
        required: false
      rxBytesTotal:
        type: int64
        required: false
      txBytesTotal:
        type: int64
        required: false
  DeviceSession:
    fields:
      sessionId:
        type: string
        required: true
      deviceId:
        type: string
        required: true
      deviceToken:
        type: string
        required: true
      deviceTokenExpiresAt:
        type: int64
        required: true
      deviceRefreshToken:
        type: string
        required: true
      activeNetworkIds:
        type: string[]
        required: false
  DeviceNetworkStateRequest:
    fields:
      deviceId:
        type: string
        required: false
      networkId:
        type: string
        required: false
      controlReachable:
        type: bool
        required: true
      networkOnline:
        type: bool
        required: true
      tunnelUp:
        type: bool
        required: true
      lastProbeOk:
        type: bool
        required: true
      virtualIp:
        type: string
        required: false
      reportedAt:
        type: int64
        required: false
  DeviceNetworkState:
    fields:
      deviceId:
        type: string
        required: true
      networkId:
        type: string
        required: true
      controlReachable:
        type: bool
        required: true
      networkOnline:
        type: bool
        required: true
      tunnelUp:
        type: bool
        required: true
      lastProbeOk:
        type: bool
        required: true
      virtualIp:
        type: string
        required: false
      lastSeenAt:
        type: int64
        required: true
      updatedAt:
        type: int64
        required: true
  Device:
    fields:
      deviceId:
        type: string
        required: true
      name:
        type: string
        required: true
      platform:
        type: string
        required: true
      deviceVersion:
        type: string
        required: false
      countryCode:
        type: string
        required: false
      status:
        type: string
        required: true
      currentVirtualIp:
        type: string
        required: false
      linkStatus:
        type: string
        required: false
      connectivityProtocol:
        type: string
        required: false
      joinedAt:
        type: int64
        required: false
      membershipStatus:
        type: string
        required: false
      networkRole:
        type: string
        required: false
      createdAt:
        type: int64
        required: false
      publicKey:
        type: string
        required: false
      networkIds:
        type: string[]
        required: false
      mqtt:
        type: MQTTCredential
        required: false
      networkState:
        type: DeviceNetworkState
        required: false
  MQTTCredential:
    fields:
      brokerUrl:
        type: string
        required: true
      clientId:
        type: string
        required: true
      username:
        type: string
        required: true
      password:
        type: string
        required: true
      topicPrefix:
        type: string
        required: true
      expiresAt:
        type: int64
        required: false
  RegisterNodeRequest:
    fields:
      deviceId:
        type: string
        required: true
      nodeId:
        type: string
        required: true
      nodePublicKey:
        type: string
        required: true
      capabilities:
        type: string[]
        required: false
  Node:
    fields:
      nodeId:
        type: string
        required: true
      deviceId:
        type: string
        required: true
      nodePublicKey:
        type: string
        required: true
      networkIds:
        type: string[]
        required: false
      capabilities:
        type: string[]
        required: false
