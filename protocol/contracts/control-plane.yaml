        type: RelayCity[]
        required: false
  RelayConfig:
    fields:
      defaultClusterId:
        type: string
        required: true
      countries:
        type: RelayCountry[]
        required: false
  RelayDataPlanePolicy:
    fields:
      policyId:
        type: string
        required: false
      version:
        type: int
        required: true
      scope:
        type: string
