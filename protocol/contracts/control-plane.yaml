        type: DNSConfig
        required: true
      mtu:
        type: int
        required: false
  RelayNode:
    fields:
      nodeId:
        type: string
        required: true
      transport:
        type: string
        required: true
      address:
        type: string
        required: true
      priority:
        type: int
        required: true
      tags:
        type: string[]
        required: false
  RelayCluster:
    fields:
      clusterId:
        type: string
        required: true
