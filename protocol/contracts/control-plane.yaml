        comment: global / region / network / device / device_override。
      networkId:
        type: string
        required: false
      targetDeviceIds:
        type: string[]
        required: false
      recommendationLevel:
        type: int
        required: false
        comment: 服务端 12 级建议档位，范围 0..11。
      executionLevel:
        type: int
        required: false
        comment: 客户端 8 级执行档位，范围 0..7。
