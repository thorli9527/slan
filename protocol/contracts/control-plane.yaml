        type: int
        required: true
      maxFramePayload:
        type: int
        required: true
      reason:
        type: string
        required: false
      ttlMs:
        type: int64
        required: false
      effectiveMs:
        type: int64
        required: false
      updatedAtMs:
        type: int64
        required: false
  RelayDataPlanePolicyEnvelope:
    fields:
      type:
        type: string
        required: true
        comment: 固定 relay_data_plane_policy。
      payload:
        type: RelayDataPlanePolicy
        required: true
  RelayPolicyReport:
    fields:
      networkId:
        type: string
        required: true
      deviceId:
        type: string
        required: false
      policyId:
        type: string
        required: false
      scope:
        type: string
        required: false
      targetDeviceIds:
        type: string[]
        required: false
      relayMtu:
        type: int
        required: false
      maxFramePayload:
        type: int
        required: false
      executionLevel:
        type: int
        required: false
      applied:
        type: bool
        required: true
      reason:
        type: string
        required: false
      policyUpdatedAtMs:
        type: int64
        required: false
      reportedAtMs:
        type: int64
        required: false
  RelayPolicyReportEnvelope:
    fields:
      type:
        type: string
        required: true
        comment: 固定 relay_policy_report。
      payload:
        type: RelayPolicyReport
        required: true
