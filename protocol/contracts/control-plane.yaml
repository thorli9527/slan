version: 1
slice: control-plane
source_of_truth: server/server-biz/api/dto
contracts:
  BootstrapRequest:
    fields:
      nodeId:
        type: string
        required: true
      networkId:
        type: string
        required: true
  CreateControlSessionRequest:
    fields:
      nodeId:
        type: string
        required: true
      networkId:
        type: string
        required: true
  ControlPlaneConfig:
    fields:
      wsUrl:
        type: string
        required: true
      heartbeatSeconds:
        type: int
        required: true
  Endpoint:
    fields:
      type:
        type: string
        required: true
      address:
        type: string
        required: true
      updatedAt:
        type: int64
        required: true
  Peer:
    fields:
      nodeId:
        type: string
        required: true
      deviceId:
        type: string
        required: true
      publicKey:
        type: string
        required: true
      status:
        type: string
        required: true
