                $ref: '#/components/schemas/RelayTicket'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NetworkId:
      name: networkId
      in: path
      required: true
      schema:
        type: string
    CallbackId:
      name: callbackId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    SubnetId:
      name: subnetId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceId:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string

    AuthResponse:
      type: object
      required: [userId, accessToken, expiresIn]
      properties:
        userId:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    CompleteAuthCallbackRequest:
      type: object
      required: [accessToken, userId, expiresIn]
      properties:
        accessToken:
          type: string
        userId:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        deviceId:
          type: string
        userLabel:
          type: string
        action:
          type: string

    AuthCallbackStatusResponse:
      type: object
      required: [callbackId, ready, received]
      properties:
        callbackId:
          type: string
        ready:
          type: boolean
        received:
          type: boolean
        receivedAt:
          type: integer
        payload:
          $ref: '#/components/schemas/CompleteAuthCallbackRequest'

    StatusOKResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    RegisterDeviceRequest:
      type: object
      required: [name, platform, machineId, publicKey]
      properties:
        name:
          type: string
        platform:
          type: string
        machineId:
          type: string
        publicKey:
          type: string

    Device:
      type: object
      required: [deviceId, name, platform, status]
      properties:
        deviceId:
          type: string
        name:
          type: string
        ownerEmail:
          type: string
        platform:
          type: string
        machineId:
          type: string
        status:
          type: string
        currentVirtualIp:
          type: string
        linkStatus:
          type: string
        connectivityProtocol:
          type: string
        joinedAt:
          type: integer
          format: int64
        membershipStatus:
          type: string
        networkRole:
          type: string
        createdAt:
          type: integer
          format: int64
        publicKey:
          type: string
        networkIds:
          type: array
          items:
            type: string

    CreateNetworkRequest:
      type: object
      required: [name, cidr]
      properties:
        name:
          type: string
        description:
          type: string
        cidr:
          type: string
        bindDeviceId:
          type: string

    UpdateNetworkRequest:
      type: object
      required: [cidr]
      properties:
        name:
          type: string
        description:
          type: string
        cidr:
          type: string

    SwitchNetworkRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    DeactivateNetworkRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    JoinNetworkRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    JoinNetworkByOwnerEmailRequest:
      type: object
      required: [ownerEmail, deviceId]
      properties:
        ownerEmail:
          type: string
          format: email
        deviceId:
          type: string

    JoinNetworkByKeyRequest:
      type: object
      required: [joinKey, deviceId]
      properties:
        joinKey:
          type: string
        deviceId:
          type: string

    UpdateNetworkMemberStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, rejected]

    UpdateNetworkJoinKeyRequest:
      type: object
      properties:
        joinKey:
          type: string

    UpdateNetworkDNSRequest:
      type: object
      properties:
        servers:
          type: array
          items:
            type: string
        searchDomains:
          type: array
          items:
            type: string

    UpdateAttachmentIPRequest:
      type: object
      required: [virtualIp]
      properties:
        virtualIp:
          type: string

    UpdateAttachmentRemarkRequest:
      type: object
      properties:
        remark:
          type: string

    CreateSubnetRequest:
      type: object
      required: [name, cidr]
      properties:
        name:
          type: string
        cidr:
          type: string
        gatewayIp:
          type: string
        allocationStartIp:
          type: string
        allocationEndIp:
          type: string

    AttachDeviceRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    Network:
      type: object
      required: [networkId, name]
      properties:
        networkId:
          type: string
        name:
          type: string
        description:
          type: string
        defaultSubnetId:
          type: string
        defaultSubnetCidr:
          type: string
        joinKeyConfigured:
          type: boolean

    NetworkHome:
      type: object
      required: [hasNetwork]
      properties:
        activeNetwork:
          $ref: '#/components/schemas/Network'
        ownedNetwork:
          $ref: '#/components/schemas/Network'
        hasNetwork:
          type: boolean

    NetworkMember:
      type: object
      required: [memberId, networkId, deviceId, role]
      properties:
        memberId:
          type: string
        networkId:
          type: string
        deviceId:
          type: string
        role:
          type: string
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, active, rejected]
        virtualIp:
          type: string

    Subnet:
      type: object
      required: [subnetId, networkId, name, cidr, isDefault]
      properties:
        subnetId:
          type: string
        networkId:
          type: string
        name:
          type: string
        cidr:
          type: string
        gatewayIp:
          type: string
        allocationStartIp:
          type: string
        allocationEndIp:
          type: string
        isDefault:
          type: boolean
        status:
          type: string

    NetworkDetail:
      allOf:
        - $ref: '#/components/schemas/Network'
        - type: object
          required: [ownedByCurrentUser, dns, members, subnets]
          properties:
            ownedByCurrentUser:
              type: boolean
            dns:
              $ref: '#/components/schemas/DNSConfig'
            joinKey:
              type: string
            members:
              type: array
              items:
                $ref: '#/components/schemas/NetworkMember'
            subnets:
              type: array
              items:
                $ref: '#/components/schemas/Subnet'

    SubnetAttachment:
      type: object
      required: [attachmentId, networkId, subnetId, deviceId]
      properties:
        attachmentId:
          type: string
        networkId:
          type: string
        subnetId:
          type: string
        deviceId:
          type: string
        virtualIp:
          type: string
        remark:
          type: string
        status:
          type: string

    NetworkJoinResult:
      type: object
      required: [member, attachment]
      properties:
        member:
          $ref: '#/components/schemas/NetworkMember'
        attachment:
          $ref: '#/components/schemas/SubnetAttachment'

    NetworkJoinByOwnerEmailResult:
      type: object
      required: [network, member, attachment]
      properties:
        network:
          $ref: '#/components/schemas/Network'
        member:
          $ref: '#/components/schemas/NetworkMember'
        attachment:
          $ref: '#/components/schemas/SubnetAttachment'

    NetworkAssignment:
      type: object
      required: [attachmentId, networkId, subnetId, deviceId, deviceName, userId, userEmail, role]
      properties:
        attachmentId:
          type: string
        networkId:
          type: string
        subnetId:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        userId:
          type: string
        userEmail:
          type: string
          format: email
        role:
          type: string
        remark:
          type: string
        virtualIp:
          type: string
        status:
          type: string

    NetworkDeactivatedResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [deactivated]

    RegisterNodeRequest:
      type: object
      required: [deviceId, nodeId, nodePublicKey]
      properties:
        deviceId:
          type: string
        nodeId:
          type: string
        nodePublicKey:
          type: string
        capabilities:
          type: array
          items:
            type: string

    Node:
      type: object
      required: [nodeId, deviceId, networkIds, nodePublicKey]
      properties:
        nodeId:
          type: string
        deviceId:
          type: string
        nodePublicKey:
          type: string
        networkIds:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string

    CreateControlSessionRequest:
      type: object
      required: [nodeId, networkId]
      properties:
        nodeId:
          type: string
        networkId:
          type: string

    BootstrapRequest:
      type: object
      required: [nodeId, networkId]
      properties:
        nodeId:
          type: string
        networkId:
          type: string

    BootstrapResponse:
      type: object
      required: [device, networks, controlPlane, stunServers, relay, derpMap, networkMap]
      properties:
        controlSessionId:
          type: string
        sessionToken:
          type: string
        device:
          $ref: '#/components/schemas/DeviceBootstrap'
        networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDetail'
        controlPlane:
          $ref: '#/components/schemas/ControlPlaneConfig'
        stunServers:
          type: array
          items:
            type: string
        relay:
          $ref: '#/components/schemas/RelayConfig'
        derpMap:
          $ref: '#/components/schemas/DerpMap'
        networkMap:
          $ref: '#/components/schemas/NetworkMap'

    DeviceBootstrap:
      type: object
      required: [device, attachments]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SubnetAttachment'

    ControlSessionResponse:
      type: object
      required: [controlSessionId, sessionToken, controlPlane, networkMap]
      properties:
        controlSessionId:
          type: string
        sessionToken:
          type: string
        controlPlane:
          $ref: '#/components/schemas/ControlPlaneConfig'
        networkMap:
          $ref: '#/components/schemas/NetworkMap'

    ControlPlaneConfig:
      type: object
      required: [wsUrl, heartbeatSeconds]
      properties:
        wsUrl:
          type: string
        heartbeatSeconds:
          type: integer

    NetworkMap:
      type: object
      required:
        [selfUserId, selfDeviceId, selfNodeId, networkId, revision, heartbeatSeconds, dns]
      properties:
        selfUserId:
          type: string
        selfDeviceId:
          type: string
        selfNodeId:
          type: string
        networkId:
          type: string
        revision:
          type: integer
        heartbeatSeconds:
          type: integer
        stunServers:
          type: array
          items:
            type: string
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
        relayRegions:
          type: array
          items:
            $ref: '#/components/schemas/RelayRegion'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        dns:
          $ref: '#/components/schemas/DNSConfig'
        mtu:
          type: integer

    Peer:
      type: object
      required: [nodeId, deviceId, publicKey, status, relayAllowed]
      properties:
        nodeId:
          type: string
        deviceId:
          type: string
        publicKey:
          type: string
        status:
          type: string
        relayAllowed:
          type: boolean
        virtualIps:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        allowedRoutes:
          type: array
          items:
            type: string

    Endpoint:
      type: object
      required: [type, address, updatedAt]
      properties:
        type:
          type: string
        address:
          type: string
        updatedAt:
          type: integer

    Route:
      type: object
      required: [cidr, viaNodeId]
      properties:
        cidr:
          type: string
        viaNodeId:
          type: string
        metric:
          type: string

    DNSConfig:
      type: object
      required: [servers, searchDomains]
      properties:
        servers:
          type: array
          items:
            type: string
        searchDomains:
          type: array
          items:
            type: string

    RelayRegion:
      type: object
      required: [regionId, regionName]
      properties:
        regionId:
          type: string
        regionName:
          type: string
        countryCode:
          type: string
        countryName:
          type: string
        cityCode:
          type: string
        cityName:
          type: string
        clusterId:
          type: string
        clusterName:
          type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/RelayEndpoint'

    RelayEndpoint:
      type: object
      required: [endpointId, transport, address]
      properties:
        endpointId:
          type: string
        transport:
          type: string
        address:
          type: string

    RelayNode:
      type: object
      required: [nodeId, transport, address, priority]
      properties:
        nodeId:
          type: string
        transport:
          type: string
        address:
          type: string
        priority:
          type: integer
        tags:
          type: array
          items:
            type: string

    RelayCluster:
      type: object
      required: [clusterId, clusterName]
      properties:
        clusterId:
          type: string
        clusterName:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RelayNode'

    RelayCity:
      type: object
      required: [cityCode, cityName]
      properties:
        cityCode:
          type: string
        cityName:
          type: string
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/RelayCluster'

    RelayCountry:
      type: object
      required: [countryCode, countryName]
      properties:
        countryCode:
          type: string
        countryName:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/RelayCity'

    RelayConfig:
      type: object
      required: [defaultClusterId]
      properties:
        defaultClusterId:
          type: string
        countries:
          type: array
          items:
            $ref: '#/components/schemas/RelayCountry'

    DerpNode:
      type: object
      required: [nodeId, host, port, transport, priority]
      properties:
        nodeId:
          type: string
        host:
          type: string
        port:
          type: integer
        transport:
          type: string
        priority:
          type: integer
        tags:
          type: array
          items:
            type: string

    DerpCluster:
      type: object
      required: [clusterId, regionId, regionName, recommendedFanout]
      properties:
        clusterId:
          type: string
        clusterName:
          type: string
        regionId:
          type: string
        regionName:
          type: string
        countryCode:
          type: string
        countryName:
          type: string
        cityCode:
          type: string
        cityName:
          type: string
        recommendedFanout:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DerpNode'

    DerpMap:
      type: object
      required: [probeIntervalSeconds]
      properties:
        probeIntervalSeconds:
          type: integer
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/DerpCluster'

    RelayTicketRequest:
      type: object
      required: [networkId, srcNodeId, dstNodeId, reason]
      properties:
        networkId:
          type: string
        srcNodeId:
          type: string
        dstNodeId:
          type: string
        derpClusterId:
          type: string
        preferredDerpNodeIds:
          type: array
          items:
            type: string
        reason:
          type: string
        relayRegionId:
          type: string

    RelayTicket:
      type: object
      required: [ticketId, networkId, sessionId, srcNodeId, dstNodeId, relayUrl, expiresAt, signature]
      properties:
        ticketId:
          type: string
        networkId:
          type: string
        sessionId:
          type: string
        srcNodeId:
          type: string
        dstNodeId:
          type: string
        derpClusterId:
          type: string
        countryCode:
          type: string
        cityCode:
          type: string
        allowedDerpNodeIds:
          type: array
          items:
            type: string
        relayUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        sessionKey:
          type: string
        signature:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
