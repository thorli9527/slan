components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NetworkId:
      name: networkId
      in: path
      required: true
      schema:
        type: string
    CallbackId:
      name: callbackId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    SubnetId:
      name: subnetId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceId:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [userId, accessToken, expiresIn]
      properties:
        userId:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    CompleteAuthCallbackRequest:
      type: object
      required: [accessToken, userId, expiresIn]
      properties:
        accessToken:
          type: string
        userId:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        deviceId:
          type: string
        userLabel:
          type: string
        action:
          type: string

    AuthCallbackStatusResponse:
      type: object
      required: [callbackId, ready]
      properties:
        callbackId:
          type: string
        ready:
          type: boolean
        payload:
          $ref: '#/components/schemas/CompleteAuthCallbackRequest'

    MQTTCredential:
      type: object
      required: [brokerUrl, clientId, username, password, topicPrefix]
      properties:
        brokerUrl:
          type: string
        clientId:
          type: string
        username:
          type: string
        password:
          type: string
        topicPrefix:
          type: string
        expiresAt:
          type: integer
          format: int64

    BifroMQAuthResponse:
      type: object
      properties:
        ok:
          $ref: '#/components/schemas/BifroMQAuthOK'
        reject:
          type: string

    BifroMQAuthOK:
      type: object
      required: [tenantId, userId]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        attrs:
          type: object
          additionalProperties:
            type: string

    StatusOKResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    PublicSystemConfig:
      type: object
      required: [allowRegistration]
      properties:
        allowRegistration:
          type: boolean

    PlanStatus:
      type: object
      required: [planName, freeDeviceLimit, maxActiveDevices, dnsAvailable]
      properties:
        planName:
          type: string
          enum: [free]
        freeDeviceLimit:
          type: integer
          example: 2
        maxActiveDevices:
          type: integer
          example: 2
        relayBandwidthLimitKbps:
          type: integer
          example: 512
        p2pUnlimited:
          type: boolean
        dnsAvailable:
          type: boolean

    OpsLoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName:
          type: string
        password:
          type: string
          format: password

    OpsLoginResponse:
      type: object
      required: [adminId, userId, loginName, displayName, accessToken, expiresIn]
      properties:
        adminId:
          type: string
        userId:
          type: string
        loginName:
          type: string
        displayName:
          type: string
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64

    OpsOverview:
      type: object
      required: [userCount, deviceCount, onlineDeviceCount, nodeCount, relayClusterCount, relayNodeCount, relayOnlineNodeCount, defaultAdminSeeded, defaultAdminRoleBound]
      properties:
        userCount:
          type: integer
        deviceCount:
          type: integer
        onlineDeviceCount:
          type: integer
        nodeCount:
          type: integer
        relayClusterCount:
          type: integer
        relayNodeCount:
          type: integer
        relayOnlineNodeCount:
          type: integer
        defaultAdminSeeded:
          type: boolean
        defaultAdminLoginName:
          type: string
        defaultAdminRoleBound:
          type: boolean
        securityWarnings:
          type: array
          items:
            type: string

    OpsUser:
      type: object
      required: [userId, email, deviceCount, nodeCount]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        deviceCount:
          type: integer
        nodeCount:
          type: integer
        roleIds:
          type: array
          items:
            type: string
        roleCodes:
          type: array
          items:
            type: string
        roleNames:
          type: array
          items:
            type: string
        planOverride:
          $ref: '#/components/schemas/PlanConfig'

    PlanConfig:
