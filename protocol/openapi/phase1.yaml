        杩斿洖褰撳墠鑺傜偣鎵€闇€鐨勫熀纭€鍚姩淇℃伅锛屽寘鎷帶鍒堕€氶亾銆丼TUN銆乺elay 鍖哄煙
        浠ュ強褰撳墠缃戠粶鐨勫垵濮?NetworkMap銆?
      security:
        - bearerAuth: []
