# SLAN control plane HTTP API draft.
#
# Design goals:
# - HTTP handles management and one-time authorization.
# - Node realtime sync uses MQTT control envelopes and protobuf.
# - Node identity, NetworkMap, and relay tickets are coordinated around node orchestration.
openapi: 3.1.0
info:
  title: SLAN Control Plane API
  version: 0.3.0
  description: >
    The protocol follows a Tailscale-style control plane design.
    HTTP manages users, devices, nodes, networks, NetworkMap authorization, and relay tickets.
    Realtime peer sync and connection plans are delivered through the control channel.
    The data plane prefers P2P and falls back to relay when needed.
servers:
  - url: http://localhost:8080
    description: Local development control plane
tags:
  - name: Auth
  - name: Devices
  - name: Networks
  - name: Nodes
  - name: Control
  - name: Relay
  - name: Ops
  - name: System
paths:
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /debug/vars:
    get:
      tags: [System]
      operationId: debugVars
      summary: Expvar diagnostics
      description: Diagnostic endpoint exposed by the public router for local
        debugging and deployment observability.
      responses:
        '200':
          description: Expvar diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /system/public-config:
    get:
      tags: [System]
      operationId: getPublicSystemConfig
      summary: Get public system configuration
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSystemConfig'

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /auth/callback-status/{callbackId}:
    get:
      tags: [Auth]
      operationId: getAuthCallbackStatus
      summary: Get browser login callback status
      parameters:
        - $ref: '#/components/parameters/CallbackId'
      responses:
        '200':
          description: Callback status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackStatusResponse'
  /auth/callback-status/{callbackId}/complete:
    post:
      tags: [Auth]
      operationId: completeAuthCallbackStatus
      summary: Complete browser login callback
      parameters:
        - $ref: '#/components/parameters/CallbackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAuthCallbackRequest'
      responses:
        '200':
          description: Callback payload stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /mqtt/bifromq/auth:
    post:
      tags: [Auth]
      operationId: authenticateBifroMQ
      summary: Validate a SLAN MQTT credential from the BifroMQ Auth Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, username, password]
              properties:
                clientId:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: BifroMQ authentication accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifroMQAuthResponse'
        '403':
          description: BifroMQ authentication rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifroMQAuthResponse'

  /mqtt/bifromq/check:
    post:
      tags: [Auth]
      operationId: authorizeBifroMQ
      summary: Authorize BifroMQ MQTT actions for a previously authenticated principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Plain text `true` when the action is allowed, otherwise `false`
          content:
            text/plain:
              schema:
                type: boolean

  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List current user devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'

  /devices/{deviceId}/networks/{networkId}/state:
    put:
      tags: [Devices]
      operationId: updateDeviceNetworkState
      summary: Report device network runtime state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceNetworkStateRequest'
      responses:
        '200':
          description: Device network state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceNetworkState'

  /networks:
    get:
      tags: [Networks]
      operationId: listNetworks
      summary: List visible networks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Network'
    post:
      tags: [Networks]
      operationId: createNetwork
      summary: Create network
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkRequest'
      responses:
        '201':
          description: Network created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'

  /networks/home:
    get:
      tags: [Networks]
      operationId: getNetworkHome
      summary: Get current user's active and owned network summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network home state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkHome'

  /plan:
    get:
      tags: [Networks]
      operationId: getPlanStatus
      summary: Get current user's fixed access plan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fixed plan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanStatus'

  /networks/{networkId}:
    get:
      tags: [Networks]
      operationId: getNetwork
      summary: Get network detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Network detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'
    put:
      tags: [Networks]
      operationId: updateNetwork
      summary: Update network settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkRequest'
      responses:
        '200':
          description: Network updated
            application/json:
              schema:
                $ref: '#/components/schemas/Network'

  /networks/{networkId}/join-key:
    put:
      tags: [Networks]
      operationId: updateNetworkJoinKey
      summary: Set or refresh network join key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkJoinKeyRequest'
      responses:
        '200':
          description: Join key updated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'

  /networks/{networkId}/dns:
    put:
      tags: [Networks]
      operationId: updateNetworkDns
      summary: Update network DNS settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkDNSRequest'
      responses:
        '200':
          description: DNS settings updated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'

  /networks/{networkId}/switch:
    post:
      tags: [Networks]
      operationId: switchNetwork
      summary: Switch active network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchNetworkRequest'
      responses:
        '200':
          description: Network switched
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/join:
    post:
      tags: [Networks]
      operationId: joinNetwork
      summary: Join device to network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkRequest'
      responses:
        '200':
          description: Network joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/activate:
    post:
      tags: [Networks]
      operationId: activateNetwork
      summary: Activate device access on target network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkRequest'
      responses:
        '200':
          description: Network activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/relay-candidates:
    post:
      tags: [Networks]
      operationId: getRelayCandidates
      summary: Pull relay candidates for current device and network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkRequest'
      responses:
        '200':
          description: Relay candidate network map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMap'

  /networks/{networkId}/deactivate:
    post:
      tags: [Networks]
      operationId: deactivateNetwork
      summary: Deactivate device network access and virtual IP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateNetworkRequest'
      responses:
        '200':
          description: Network deactivated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDeactivatedResponse'

  /networks/join-by-key:
    post:
      tags: [Networks]
      operationId: joinNetworkByKey
      summary: Join network by join key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkByKeyRequest'
      responses:
        '200':
          description: Network joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/members/{memberId}/status:
    put:
      tags: [Networks]
      operationId: updateNetworkMemberStatus
      summary: Approve or reject network join request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkMemberStatusRequest'
      responses:
        '200':
          description: Member status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMember'

  /networks/{networkId}/members:
    get:
      tags: [Networks]
      operationId: listNetworkMembers
      summary: List network members
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkMember'

  /networks/{networkId}/invitations:
    post:
      tags: [Networks]
      operationId: inviteNetworkMember
      summary: Invite a user to join the network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteNetworkMemberRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMember'

  /networks/{networkId}/assignments:
    get:
      tags: [Networks]
      operationId: listNetworkAssignments
      summary: List network device and virtual IP assignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Assignment list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkAssignment'

  /networks/{networkId}/subnets:
    get:
      tags: [Networks]
      operationId: listSubnets
      summary: List network subnets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Subnet list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subnet'
  /networks/{networkId}/attachments/{attachmentId}/ip:
    put:
      tags: [Networks]
      operationId: updateAttachmentIp
      summary: Update attachment virtual IP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentIPRequest'
      responses:
        '200':
          description: Virtual IP updated
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetAttachment'

  /networks/{networkId}/attachments/{attachmentId}/remark:
    put:
      tags: [Networks]
      operationId: updateAttachmentRemark
      summary: Update network device remark
      description: >
        Network owners can maintain remarks for any member device.
        Device owners can also maintain their own attachment remark.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRemarkRequest'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAssignment'

  /networks/{networkId}/attachments/{attachmentId}/status:
    put:
      tags: [Networks]
      operationId: updateAttachmentStatus
      summary: Enable or disable a network device attachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentStatusRequest'
      responses:
        '200':
          description: Attachment status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAssignment'

  /nodes/register:
    post:
      tags: [Nodes]
      operationId: registerNode
      summary: Register node identity
      description: >
        Node identity is separate from the business device identity.
        After receiving a deviceId, the client registers nodeId and nodePublicKey for control and data plane use.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterNodeRequest'
      responses:
        '201':
          description: Node registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  /control/sessions:
    post:
      tags: [Control]
      operationId: createControlSession
      summary: Create control channel session
      description: >
        The control plane returns the control session token, MQTT control channel credentials, and initial NetworkMap.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateControlSessionRequest'
      responses:
        '201':
          description: Control session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlSessionResponse'

  /bootstrap:
    post:
      tags: [Control]
      operationId: bootstrap
      summary: Get node bootstrap configuration
      description: >
        Returns bootstrap data required by the current node, including control channel, STUN, relay regions,
        and the initial NetworkMap for the current network.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Bootstrap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'

  /relay/tickets:
    post:
      tags: [Relay]
      operationId: issueRelayTicket
      summary: Issue relay fallback ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayTicketRequest'
      responses:
        '201':
          description: Relay ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTicket'

  /ops-api/login:
    post:
      tags: [Ops]
      operationId: opsLogin
      summary: Login to operations console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsLoginRequest'
      responses:
        '200':
          description: Operations session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsLoginResponse'

  /ops-api/logout:
    post:
      tags: [Ops]
      operationId: opsLogout
      summary: Logout from operations console
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /ops-api/me/password:
    put:
      tags: [Ops]
      operationId: opsChangeOwnPassword
      summary: Change current operations administrator password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminPasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /ops-api/overview:
    get:
      tags: [Ops]
      operationId: opsOverview
      summary: Get operations overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operations overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOverview'

  /ops-api/users:
    get:
      tags: [Ops]
      operationId: opsListUsers
      summary: List users for operations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsUser'

  /ops-api/plan-config:
    get:
      tags: [Ops]
      operationId: opsGetPlanConfig
      summary: Get global operations plan configuration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plan configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanConfig'
    put:
      tags: [Ops]
      operationId: opsUpdatePlanConfig
      summary: Update global operations plan configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanConfigRequest'
      responses:
        '200':
          description: Plan configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanConfig'

  /ops-api/users/{userId}/plan:
    put:
      tags: [Ops]
      operationId: opsUpdateUserPlan
      summary: Set a user-specific plan override
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanConfigRequest'
      responses:
        '200':
          description: User plan override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlanOverride'
    delete:
      tags: [Ops]
      operationId: opsDeleteUserPlan
      summary: Delete a user-specific plan override
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User plan override deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /ops-api/devices:
    get:
      tags: [Ops]
      operationId: opsListDevices
      summary: List devices for operations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsDevice'

  /ops-api/admins:
    get:
      tags: [Ops]
      operationId: opsListAdmins
      summary: List operations administrators
      security:
        - bearerAuth: []
      responses:
        '200':
