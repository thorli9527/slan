# SLAN control plane HTTP API draft.
#
# Design goals:
# - HTTP handles management and one-time authorization.
# - Node realtime sync uses MQTT control envelopes and protobuf.
# - Node identity, NetworkMap, and relay tickets are coordinated around node orchestration.
openapi: 3.1.0
info:
  title: SLAN Control Plane API
  version: 0.3.0
  description: >
    The protocol follows a Tailscale-style control plane design.
    HTTP manages users, devices, nodes, networks, NetworkMap authorization, and relay tickets.
    Realtime peer sync and connection plans are delivered through the control channel.
    The data plane prefers P2P and falls back to relay when needed.
servers:
  - url: http://localhost:8080
    description: Local development control plane
tags:
  - name: Auth
  - name: Devices
  - name: Networks
  - name: Nodes
  - name: Control
  - name: Relay
  - name: System
paths:
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /debug/vars:
    get:
      tags: [System]
      operationId: debugVars
      summary: Expvar diagnostics
      description: Diagnostic endpoint exposed by the public router for local
        debugging and deployment observability.
      responses:
        '200':
          description: Expvar diagnostics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/callback-status/{callbackId}:
    get:
      tags: [Auth]
      operationId: getAuthCallbackStatus
      summary: Get browser login callback status
      parameters:
        - $ref: '#/components/parameters/CallbackId'
      responses:
        '200':
          description: Callback status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackStatusResponse'
  /auth/callback-status/{callbackId}/complete:
    post:
      tags: [Auth]
      operationId: completeAuthCallbackStatus
      summary: Complete browser login callback
      parameters:
        - $ref: '#/components/parameters/CallbackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAuthCallbackRequest'
      responses:
        '200':
          description: Callback payload stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'

  /mqtt/auth/check:
    post:
      tags: [Auth]
      operationId: checkMQTTAuth
      summary: Validate a generated SLAN MQTT credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MQTTAuthCheckRequest'
      responses:
        '200':
          description: MQTT auth decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MQTTAuthCheckResponse'

  /mqtt/bifromq/auth:
    post:
      tags: [Auth]
      operationId: authenticateBifroMQ
      summary: Validate a SLAN MQTT credential from the BifroMQ Auth Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MQTTAuthCheckRequest'
      responses:
        '200':
          description: BifroMQ authentication accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifroMQAuthResponse'
        '403':
          description: BifroMQ authentication rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifroMQAuthResponse'

  /mqtt/bifromq/check:
    post:
      tags: [Auth]
      operationId: authorizeBifroMQ
      summary: Authorize BifroMQ MQTT actions for a previously authenticated principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Plain text `true` when the action is allowed, otherwise `false`
          content:
            text/plain:
              schema:
                type: boolean

  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List current user devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'

  /devices/{deviceId}/networks/{networkId}/state:
    put:
      tags: [Devices]
      operationId: updateDeviceNetworkState
      summary: Report device network runtime state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceNetworkStateRequest'
      responses:
        '200':
          description: Device network state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceNetworkState'

  /networks:
    get:
      tags: [Networks]
      operationId: listNetworks
      summary: List visible networks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Network'
    post:
      tags: [Networks]
      operationId: createNetwork
      summary: Create network
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkRequest'
      responses:
        '201':
          description: Network created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'

  /networks/home:
    get:
      tags: [Networks]
      operationId: getNetworkHome
      summary: Get current user's active and owned network summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network home state
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkHome'

  /networks/{networkId}:
    get:
      tags: [Networks]
      operationId: getNetwork
      summary: Get network detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Network detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'
    put:
      tags: [Networks]
      operationId: updateNetwork
      summary: Update network settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkRequest'
      responses:
        '200':
          description: Network updated
            application/json:
              schema:
                $ref: '#/components/schemas/Network'

  /networks/{networkId}/join-key:
    put:
      tags: [Networks]
      operationId: updateNetworkJoinKey
      summary: Set or refresh network join key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkJoinKeyRequest'
      responses:
        '200':
          description: Join key updated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'

  /networks/{networkId}/dns:
    put:
      tags: [Networks]
      operationId: updateNetworkDns
      summary: Update network DNS settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkDNSRequest'
      responses:
        '200':
          description: DNS settings updated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'

  /networks/{networkId}/switch:
    post:
      tags: [Networks]
      operationId: switchNetwork
      summary: Switch active network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchNetworkRequest'
      responses:
        '200':
          description: Network switched
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/join:
    post:
      tags: [Networks]
      operationId: joinNetwork
      summary: Join device to network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkRequest'
      responses:
        '200':
          description: Network joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/activate:
    post:
      tags: [Networks]
      operationId: activateNetwork
      summary: Activate device access on target network
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkRequest'
      responses:
        '200':
          description: Network activated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/deactivate:
    post:
      tags: [Networks]
      operationId: deactivateNetwork
      summary: Deactivate device network access and virtual IP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateNetworkRequest'
      responses:
        '200':
          description: Network deactivated
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDeactivatedResponse'

  /networks/join-by-owner-email:
    post:
      tags: [Networks]
      operationId: joinNetworkByOwnerEmail
      summary: Join network by owner email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkByOwnerEmailRequest'
      responses:
        '200':
          description: Network joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinByOwnerEmailResult'

  /networks/join-by-key:
    post:
      tags: [Networks]
      operationId: joinNetworkByKey
      summary: Join network by join key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinNetworkByKeyRequest'
      responses:
        '200':
          description: Network joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkJoinResult'

  /networks/{networkId}/members/{memberId}/status:
    put:
      tags: [Networks]
      operationId: updateNetworkMemberStatus
      summary: Approve or reject network join request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkMemberStatusRequest'
      responses:
        '200':
          description: Member status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkMember'

  /networks/{networkId}/members:
    get:
      tags: [Networks]
      operationId: listNetworkMembers
      summary: List network members
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkMember'

  /networks/{networkId}/assignments:
    get:
      tags: [Networks]
      operationId: listNetworkAssignments
      summary: List network device and virtual IP assignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Assignment list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkAssignment'

  /networks/{networkId}/subnets:
    get:
      tags: [Networks]
      operationId: listSubnets
      summary: List network subnets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
      responses:
        '200':
          description: Subnet list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subnet'
  /networks/{networkId}/subnets/{subnetId}/attachments:
    post:
      tags: [Networks]
      operationId: attachDeviceToSubnet
      summary: Attach device to subnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/SubnetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDeviceRequest'
      responses:
        '201':
          description: Device attached
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetAttachment'

  /networks/{networkId}/attachments/{attachmentId}/ip:
    put:
      tags: [Networks]
      operationId: updateAttachmentIp
      summary: Update attachment virtual IP
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentIPRequest'
      responses:
        '200':
          description: Virtual IP updated
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetAttachment'

  /networks/{networkId}/attachments/{attachmentId}/remark:
    put:
      tags: [Networks]
      operationId: updateAttachmentRemark
      summary: Update network device remark
      description: >
        Network owners can maintain remarks for any member device.
        Device owners can also maintain their own attachment remark.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NetworkId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRemarkRequest'
      responses:
        '200':
          description: Operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAssignment'

  /nodes/register:
    post:
      tags: [Nodes]
      operationId: registerNode
      summary: Register node identity
      description: >
        Node identity is separate from the business device identity.
        After receiving a deviceId, the client registers nodeId and nodePublicKey for control and data plane use.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterNodeRequest'
      responses:
        '201':
          description: Node registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  /control/sessions:
    post:
      tags: [Control]
      operationId: createControlSession
      summary: Create control channel session
      description: >
        The control plane returns the control session token, WebSocket address, and initial NetworkMap.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateControlSessionRequest'
      responses:
        '201':
          description: Control session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlSessionResponse'

  /bootstrap:
    post:
      tags: [Control]
      operationId: bootstrap
      summary: Get node bootstrap configuration
      description: >
        Returns bootstrap data required by the current node, including control channel, STUN, relay regions,
        and the initial NetworkMap for the current network.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Bootstrap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'

  /relay/tickets:
    post:
      tags: [Relay]
      operationId: issueRelayTicket
      summary: Issue relay fallback ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayTicketRequest'
      responses:
        '201':
          description: Relay ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTicket'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    NetworkId:
      name: networkId
      in: path
      required: true
      schema:
        type: string
    CallbackId:
      name: callbackId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    SubnetId:
      name: subnetId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceId:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string

    AuthResponse:
      type: object
      required: [userId, accessToken, expiresIn]
      properties:
        userId:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    CompleteAuthCallbackRequest:
      type: object
      required: [accessToken, userId, expiresIn]
      properties:
        accessToken:
          type: string
        userId:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        deviceId:
          type: string
        userLabel:
          type: string
        action:
          type: string

    AuthCallbackStatusResponse:
      type: object
      required: [callbackId, ready]
      properties:
        callbackId:
          type: string
        ready:
          type: boolean
        payload:
          $ref: '#/components/schemas/CompleteAuthCallbackRequest'

    MQTTCredential:
      type: object
      required: [brokerUrl, clientId, username, password, topicPrefix]
      properties:
        brokerUrl:
          type: string
        clientId:
          type: string
        username:
          type: string
        password:
          type: string
        topicPrefix:
          type: string
        expiresAt:
          type: integer
          format: int64

    MQTTAuthCheckRequest:
      type: object
      required: [clientId, username, password]
      properties:
        clientId:
          type: string
        username:
          type: string
        password:
          type: string

    MQTTAuthCheckResponse:
      type: object
      required: [allow]
      properties:
        allow:
          type: boolean
        deviceId:
          type: string
        principal:
          type: string

    BifroMQAuthResponse:
      type: object
      properties:
        ok:
          $ref: '#/components/schemas/BifroMQAuthOK'
        reject:
          type: string

    BifroMQAuthOK:
      type: object
      required: [tenantId, userId]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        attrs:
          type: object
          additionalProperties:
            type: string

    StatusOKResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    RegisterDeviceRequest:
      type: object
      required: [name, platform, machineId, publicKey]
      properties:
        name:
          type: string
        platform:
          type: string
        machineId:
          type: string
        publicKey:
          type: string

    DeviceNetworkStateRequest:
      type: object
      required: [controlReachable, networkOnline, tunnelUp, lastProbeOk]
      properties:
        deviceId:
          type: string
        networkId:
          type: string
        controlReachable:
          type: boolean
        networkOnline:
          type: boolean
        tunnelUp:
          type: boolean
        lastProbeOk:
          type: boolean
        virtualIp:
          type: string
        reportedAt:
          type: integer
          format: int64

    DeviceNetworkState:
      type: object
      required: [deviceId, networkId, controlReachable, networkOnline, tunnelUp, lastProbeOk, lastSeenAt, updatedAt]
      properties:
        deviceId:
          type: string
        networkId:
          type: string
        controlReachable:
          type: boolean
        networkOnline:
          type: boolean
        tunnelUp:
          type: boolean
        lastProbeOk:
          type: boolean
        virtualIp:
          type: string
        lastSeenAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    Device:
      type: object
      required: [deviceId, name, platform, status]
      properties:
        deviceId:
          type: string
        name:
          type: string
        ownerEmail:
          type: string
        platform:
          type: string
        machineId:
          type: string
        status:
          type: string
        currentVirtualIp:
          type: string
        linkStatus:
          type: string
        connectivityProtocol:
          type: string
        joinedAt:
          type: integer
          format: int64
        membershipStatus:
          type: string
        networkRole:
          type: string
        createdAt:
          type: integer
          format: int64
        publicKey:
          type: string
        networkIds:
          type: array
          items:
            type: string
        mqtt:
          $ref: '#/components/schemas/MQTTCredential'
        networkState:
          $ref: '#/components/schemas/DeviceNetworkState'

    CreateNetworkRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        cidr:
          type: string
        expectedDevices:
          type: integer
