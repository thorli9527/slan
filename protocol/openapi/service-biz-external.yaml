openapi: 3.1.0
info:
  title: SLAN service-biz External HTTP API
  version: 0.1.0
  description: >
    Current external business HTTP surface implemented by server/service-biz.
    Internal wire callbacks and BifroMQ callbacks are intentionally excluded.
servers:
  - url: http://47.245.40.231:28080
    description: Remote Docker service-biz
  - url: http://127.0.0.1:28080
    description: Local Docker service-biz
tags:
  - name: System
  - name: Auth
  - name: DeviceLogin
  - name: DeviceSession
  - name: Devices
  - name: Invites
  - name: Networks
  - name: DNS
  - name: PublicMappings
  - name: SecurityGroups
  - name: Relay
  - name: Punch
  - name: Downloads
  - name: Ops
security:
  - userBearer: []
paths:
  /healthz:
    get:
      tags: [System]
      security: []
      summary: Health check
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/client-downloads:
    get:
      tags: [Downloads]
      security: []
      summary: List public client downloads
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /downloads/clients/{fileName}:
    get:
      tags: [Downloads]
      security: []
      summary: Download client package or install script
      parameters:
        - $ref: '#/components/parameters/fileName'
      responses:
        '200':
          description: Binary package or script.

  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register user and create default network
      requestBody:
        $ref: '#/components/requestBodies/Register'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login user
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/auth/renew:
    post:
      tags: [Auth]
      summary: Renew user session
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout user and optionally revoke a device session
      requestBody:
        $ref: '#/components/requestBodies/Logout'
      responses:
        '200': { $ref: '#/components/responses/Status' }
  /api/auth/console-login-keys:
    post:
      tags: [DeviceLogin]
      summary: Create console login key for a device
      requestBody:
        $ref: '#/components/requestBodies/DeviceId'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/auth/console-login:
    post:
      tags: [DeviceLogin]
      security: []
      summary: Login with console login key
      requestBody:
        $ref: '#/components/requestBodies/LoginKey'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/auth/device-login-devices:
    post:
      tags: [DeviceLogin]
      security: []
      summary: Prepare client device browser login
      requestBody:
        $ref: '#/components/requestBodies/DeviceIdentity'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/auth/device-login-devices/{deviceId}/complete:
    post:
      tags: [DeviceLogin]
      security: []
      summary: Complete client device browser login
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        $ref: '#/components/requestBodies/CompleteDeviceLogin'
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/web/device-bootstrap-keys:
    get:
      tags: [DeviceSession]
      summary: List bootstrap keys
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [DeviceSession]
      summary: Create bootstrap key
      requestBody:
        $ref: '#/components/requestBodies/BootstrapKey'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/web/device-bootstrap-keys/{keyId}/revoke:
    post:
      tags: [DeviceSession]
      summary: Revoke bootstrap key
      parameters:
        - $ref: '#/components/parameters/keyId'
      requestBody:
        $ref: '#/components/requestBodies/UserIdOptional'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/app/device/session/bootstrap:
    post:
      tags: [DeviceSession]
      security: []
      summary: Exchange bootstrap key for device session
      requestBody:
        $ref: '#/components/requestBodies/DeviceSessionBootstrap'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/app/device/session/bind:
    post:
      tags: [DeviceSession]
      summary: Bind local device to current user
      requestBody:
        $ref: '#/components/requestBodies/DeviceIdentity'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/app/device/session/renew:
    post:
      tags: [DeviceSession]
      security:
        - deviceBearer: []
      summary: Renew device session and report runtime counters
      requestBody:
        $ref: '#/components/requestBodies/DeviceSessionRenew'
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/users:
    get:
      tags: [Auth]
      summary: List users
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/users/{userId}/entitlement:
    get:
      tags: [Auth]
      summary: Get user device quota and plan entitlement
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/users/{userId}/password:
    patch:
      tags: [Auth]
      summary: Change user password
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '200': { $ref: '#/components/responses/Status' }
  /api/user-aliases:
    get:
      tags: [Auth]
      summary: List user aliases
      parameters:
        - name: ownerUserId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Items' }
    patch:
      tags: [Auth]
      summary: Upsert user alias
      requestBody:
        $ref: '#/components/requestBodies/UserAlias'
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/app/devices:
    get:
      tags: [Devices]
      summary: List devices for user
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/devices/visible:
    get:
      tags: [Devices]
      summary: List visible devices for user
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/devices/register:
    post:
      tags: [Devices]
      summary: Legacy register device
      requestBody:
        $ref: '#/components/requestBodies/RegisterDevice'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/app/devices/{deviceId}:
    patch:
      tags: [Devices]
      summary: Update device alias
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateDeviceAlias'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [Devices]
      summary: Remove visible device
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '204':
          description: Deleted.
  /api/app/devices/{deviceId}/renew:
    post:
      tags: [Devices]
      summary: Legacy renew device lease
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        $ref: '#/components/requestBodies/LegacyDeviceRenew'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/app/devices/{deviceId}/network-configs:
    get:
      tags: [Devices]
      summary: List device network configs
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/devices/{deviceId}/mqtt-credential:
    get:
      tags: [Devices]
      summary: Get device MQTT credential
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/device-invites:
    get:
      tags: [Invites]
      summary: List device invites
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [Invites]
      summary: Create device invite
      requestBody:
        $ref: '#/components/requestBodies/DeviceInvite'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/device-invites/accept:
    post:
      tags: [Invites]
      summary: Accept device invite
      requestBody:
        $ref: '#/components/requestBodies/AcceptDeviceInvite'
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/networks:
    get:
      tags: [Networks]
      summary: List networks
      parameters:
        - $ref: '#/components/parameters/userIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [Networks]
      summary: Create network
      requestBody:
        $ref: '#/components/requestBodies/CreateNetwork'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}:
    patch:
      tags: [Networks]
      summary: Update network
      parameters:
        - $ref: '#/components/parameters/networkId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateNetwork'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/devices:
    get:
      tags: [Networks]
      summary: List network devices
      parameters:
        - $ref: '#/components/parameters/networkId'
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [Networks]
      summary: Add device to network
      parameters:
        - $ref: '#/components/parameters/networkId'
      requestBody:
        $ref: '#/components/requestBodies/AddNetworkDevice'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/devices/{deviceId}:
    patch:
      tags: [Networks]
      summary: Update network device
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateNetworkDevice'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [Networks]
      summary: Remove network device
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200': { $ref: '#/components/responses/Status' }
  /api/app/networks/{networkId}/network-config:
    get:
      tags: [Networks]
      summary: Get device network config
      parameters:
        - $ref: '#/components/parameters/networkId'
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JSON' }

  /api/networks/{networkId}/dns/zones:
    get:
      tags: [DNS]
      summary: List DNS zones
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [DNS]
      summary: Add DNS zone
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/DNSZone'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/dns/zones/{zoneId}:
    patch:
      tags: [DNS]
      summary: Update DNS zone
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/zoneId'
      requestBody:
        $ref: '#/components/requestBodies/DNSZone'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [DNS]
      summary: Delete DNS zone
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/zoneId'
      responses:
        '200': { $ref: '#/components/responses/Status' }
  /api/networks/{networkId}/dns/records:
    get:
      tags: [DNS]
      summary: List DNS records
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [DNS]
      summary: Add DNS record
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/DNSRecord'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/dns/records/{recordId}:
    patch:
      tags: [DNS]
      summary: Update DNS record
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/recordId'
      requestBody:
        $ref: '#/components/requestBodies/DNSRecord'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [DNS]
      summary: Delete DNS record
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/recordId'
      responses:
        '200': { $ref: '#/components/responses/Status' }

  /api/networks/{networkId}/public-mappings:
    get:
      tags: [PublicMappings]
      summary: List public mappings
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [PublicMappings]
      summary: Create public mapping
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/PublicMapping'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/public-mappings/{mappingId}:
    patch:
      tags: [PublicMappings]
      summary: Update public mapping
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/mappingId'
      requestBody:
        $ref: '#/components/requestBodies/PublicMapping'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [PublicMappings]
      summary: Delete public mapping
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/mappingId'
      responses:
        '200': { $ref: '#/components/responses/Status' }

  /api/networks/{networkId}/security-groups:
    get:
      tags: [SecurityGroups]
      summary: List security groups
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [SecurityGroups]
      summary: Create security group
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/SecurityGroup'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/security-groups/{securityGroupId}:
    delete:
      tags: [SecurityGroups]
      summary: Delete security group
      parameters:
        - $ref: '#/components/parameters/networkId'
        - $ref: '#/components/parameters/securityGroupId'
      responses:
        '204': { description: Deleted. }
  /api/security-groups/{securityGroupId}/rules:
    get:
      tags: [SecurityGroups]
      summary: List security group rules
      parameters: [ { $ref: '#/components/parameters/securityGroupId' } ]
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [SecurityGroups]
      summary: Add security group rule
      parameters: [ { $ref: '#/components/parameters/securityGroupId' } ]
      requestBody:
        $ref: '#/components/requestBodies/SecurityRule'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/security-groups/rules/{ruleId}:
    patch:
      tags: [SecurityGroups]
      summary: Update security group rule
      parameters: [ { $ref: '#/components/parameters/ruleId' } ]
      requestBody:
        $ref: '#/components/requestBodies/SecurityRule'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
    delete:
      tags: [SecurityGroups]
      summary: Delete security group rule
      parameters: [ { $ref: '#/components/parameters/ruleId' } ]
      responses:
        '200': { $ref: '#/components/responses/Status' }

  /api/networks/{networkId}/relay-candidates:
    get:
      tags: [Relay]
      summary: List relay candidates for device
      parameters:
        - $ref: '#/components/parameters/networkId'
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [Relay]
      summary: List relay candidates for device
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/relay/tickets:
    post:
      tags: [Relay]
      summary: Issue relay ticket
      requestBody:
        $ref: '#/components/requestBodies/RelayTicket'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/networks/{networkId}/punch/connect-sessions:
    post:
      tags: [Punch]
      security:
        - punchSignature: []
      summary: Create P2P punch connect session
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/PunchConnectSession'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '201': { $ref: '#/components/responses/JSON' }

  /api/ops/auth/login:
    post:
      tags: [Ops]
      security: []
      summary: Login operator
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/ops/auth/password:
    patch:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Change own operator password
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '204': { description: Password changed. }
  /api/ops/dashboard:
    get:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Get ops dashboard
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/ops/audit-events:
    get:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Query audit events
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/ops/operators:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List operators, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Create operator
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /api/ops/operators/{operatorId}:
    patch:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Update operator
      parameters: [ { $ref: '#/components/parameters/operatorId' } ]
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /api/ops/operators/{operatorId}/password:
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Set operator password
      parameters: [ { $ref: '#/components/parameters/operatorId' } ]
      requestBody: { $ref: '#/components/requestBodies/NewPassword' }
      responses: { '204': { description: Password changed. } }

  /api/ops/relay-nodes:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List relay nodes, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create relay node, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/relay-nodes/{nodeId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update relay node, parameters: [ { $ref: '#/components/parameters/nodeId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/punch-nodes:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List punch nodes, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create punch node, requestBody: { $ref: '#/components/requestBodies/PunchNode' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/punch-nodes/{nodeId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update punch node, parameters: [ { $ref: '#/components/parameters/nodeId' } ], requestBody: { $ref: '#/components/requestBodies/PunchNode' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/customers:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List customers, responses: { '200': { $ref: '#/components/responses/Items' } } }
  /api/ops/customers/{customerId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update customer, parameters: [ { $ref: '#/components/parameters/customerId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/customers/{customerId}/assign-plan:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Assign plan to customer, parameters: [ { $ref: '#/components/parameters/customerId' } ], requestBody: { $ref: '#/components/requestBodies/AssignPlan' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/devices:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List ops devices, responses: { '200': { $ref: '#/components/responses/Items' } } }
  /api/ops/devices/{deviceId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update ops device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], requestBody: { $ref: '#/components/requestBodies/OpsDeviceUpdate' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete ops device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], responses: { '204': { description: Deleted. } } }
  /api/ops/client-downloads:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List client downloads, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Upload client download
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientDownloadUpload'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/ops/client-downloads/{downloadId}:
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete client download, parameters: [ { $ref: '#/components/parameters/downloadId' } ], responses: { '204': { description: Deleted. } } }
  /api/ops/plans:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List plans, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Upsert plan, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/plans/{planCode}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update plan, parameters: [ { $ref: '#/components/parameters/planCode' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/products:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List products, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create product, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/products/{productId}:
