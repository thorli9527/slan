openapi: 3.1.0
info:
  title: SLAN service-biz External HTTP API
  version: 0.1.0
  description: >
    Current external business HTTP surface implemented by server/service-biz.
    Internal wire callbacks and BifroMQ callbacks are intentionally excluded.
servers:
  - url: http://47.245.40.231:28080
    description: Remote Docker service-biz
  - url: http://127.0.0.1:28080
    description: Local Docker service-biz
tags:
  - name: System
  - name: DeviceAuth
  - name: DeviceSession
  - name: Devices
  - name: Networks
  - name: DNS
  - name: SecurityGroups
  - name: Relay
  - name: Punch
  - name: Ops
security: []
paths:
  /healthz:
    get:
      tags: [System]
      security: []
      summary: Health check
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/device-auth/token:
    post:
      tags: [DeviceAuth]
      security: []
      summary: Exchange a device authorization key for device tokens
      requestBody:
        $ref: '#/components/requestBodies/DeviceAuthorizationKey'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '429': { description: Too many failed authorization-key exchanges from this source. }
  /api/app/device/session/renew:
    post:
      tags: [DeviceSession]
      security:
        - deviceBearer: []
      summary: Renew device session and report runtime counters
      requestBody:
        $ref: '#/components/requestBodies/DeviceSessionRenew'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/app/client/messages:
    post:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Send a device control message
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '202': { $ref: '#/components/responses/JSON' } }
  /api/app/runtime/endpoints:
    get:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Get device runtime endpoints
      responses: { '200': { $ref: '#/components/responses/JSON' } }

  /api/app/devices/{deviceId}/renew:
    post:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Legacy renew device lease
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        $ref: '#/components/requestBodies/LegacyDeviceRenew'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/app/devices/{deviceId}/network-configs:
    get:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: List device network configs
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/devices/{deviceId}/mqtt-credential:
    get:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Get device MQTT credential
      parameters:
        - $ref: '#/components/parameters/deviceId'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/app/devices/{deviceId}/mqtt-profile:
    get:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Get device MQTT profile
      parameters: [ { $ref: '#/components/parameters/deviceId' } ]
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /api/app/devices/{deviceId}/runtime:
    post:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Report device runtime state
      parameters: [ { $ref: '#/components/parameters/deviceId' } ]
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /api/app/device/runtime/report:
    post:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Report device runtime state
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /api/app/devices/{deviceId}/logs:
    post:
      tags: [Devices]
      security: [ { deviceBearer: [] } ]
      summary: Upload device logs
      parameters: [ { $ref: '#/components/parameters/deviceId' } ]
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '202': { $ref: '#/components/responses/JSON' } }
  /api/app/networks/{networkId}/snapshot:
    get:
      tags: [Networks]
      security: [ { deviceBearer: [] } ]
      summary: Get a device-scoped network snapshot
      parameters:
        - $ref: '#/components/parameters/networkId'
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
      responses: { '200': { $ref: '#/components/responses/JSON' } }


  /api/app/networks/{networkId}/relay-candidates:
    get:
      tags: [Relay]
      summary: List relay candidates for device
      parameters:
        - $ref: '#/components/parameters/networkId'
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Items' }
    post:
      tags: [Relay]
      summary: List relay candidates for device
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/Items' }
  /api/app/relay/tickets:
    post:
      tags: [Relay]
      summary: Issue relay ticket
      requestBody:
        $ref: '#/components/requestBodies/RelayTicket'
      responses:
        '201': { $ref: '#/components/responses/JSON' }
  /api/app/networks/{networkId}/punch/connect-sessions:
    post:
      tags: [Punch]
      security:
        - punchSignature: []
      summary: Create P2P punch connect session
      parameters: [ { $ref: '#/components/parameters/networkId' } ]
      requestBody:
        $ref: '#/components/requestBodies/PunchConnectSession'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '201': { $ref: '#/components/responses/JSON' }

  /api/ops/auth/login:
    post:
      tags: [Ops]
      security: []
      summary: Login operator
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        '429': { description: Too many failed operator login attempts. }
  /api/ops/auth/password:
    patch:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Change own operator password
      description: Requires the current password, always targets the authenticated operator, and revokes all existing sessions after success.
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/ops/auth/logout:
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Revoke the current operator session
      responses:
        '204': { description: Logged out. }
  /api/ops/dashboard:
    get:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Get ops dashboard
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /api/ops/audit-events:
    get:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Query audit events
      responses:
        '200': { $ref: '#/components/responses/AuditItems' }
  /api/ops/operators:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List operators (admin only), responses: { '200': { $ref: '#/components/responses/Items' } } }
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Create operator (admin only)
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '201': { $ref: '#/components/responses/JSON' } }
  /api/ops/operators/{operatorId}:
    patch:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Update operator (admin only)
      parameters: [ { $ref: '#/components/parameters/operatorId' } ]
      requestBody: { $ref: '#/components/requestBodies/FreeForm' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }
  /api/ops/operators/{operatorId}/password:
    post:
      tags: [Ops]
      security: [ { operatorBearer: [] } ]
      summary: Set operator password (admin only)
      parameters: [ { $ref: '#/components/parameters/operatorId' } ]
      requestBody: { $ref: '#/components/requestBodies/NewPassword' }
      responses: { '200': { $ref: '#/components/responses/JSON' } }

  /api/ops/server-nodes:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List managed server nodes, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create a managed server node, requestBody: { $ref: '#/components/requestBodies/ServerNode' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/server-nodes/{nodeId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update a managed server node, parameters: [ { $ref: '#/components/parameters/nodeId' } ], requestBody: { $ref: '#/components/requestBodies/ServerNode' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete a managed server node and its runtime registrations, parameters: [ { $ref: '#/components/parameters/nodeId' } ], responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/server-nodes/{nodeId}/ssh-host-key:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Inspect the SSH host key before first deployment, parameters: [ { $ref: '#/components/parameters/nodeId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/server-nodes/{nodeId}/deploy:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Deploy enabled runtime services to a managed server node, parameters: [ { $ref: '#/components/parameters/nodeId' } ], requestBody: { $ref: '#/components/requestBodies/ServerNodeDeploy' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/customers:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List customers, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create customer, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/customers/{customerId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update customer, parameters: [ { $ref: '#/components/parameters/customerId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/devices:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List ops devices, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create a managed device, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/devices/{deviceId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update ops device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete ops device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], responses: { '204': { description: Deleted. } } }
  /api/ops/device-credentials:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List device authorization keys, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create device authorization key, description: Omit deviceId to bind the key and create the managed device on first exchange. Only the standard_device scope is currently supported., requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/device-credentials/{credentialId}/revoke:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Revoke device authorization key, parameters: [ { $ref: '#/components/parameters/credentialId' } ], responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/devices/{deviceId}/credentials:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List authorization keys for a device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create an authorization key for a device, parameters: [ { $ref: '#/components/parameters/deviceId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/networks:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List networks, responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create network, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/networks/{networkId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update network, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete network, parameters: [ { $ref: '#/components/parameters/networkId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/devices:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Add device to network, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/DeviceId' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
  /api/ops/networks/{networkId}/devices/{deviceId}:
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Remove device from network, parameters: [ { $ref: '#/components/parameters/networkId' }, { $ref: '#/components/parameters/deviceId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/device-groups:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Add device group to network, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/device-groups/{groupId}:
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Remove device group from network, parameters: [ { $ref: '#/components/parameters/networkId' }, { $ref: '#/components/parameters/groupId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/device-groups:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List device groups, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create device group, requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/device-groups/{groupId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update device group, parameters: [ { $ref: '#/components/parameters/groupId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete device group, parameters: [ { $ref: '#/components/parameters/groupId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/device-groups/{groupId}/devices:
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Add device group member, parameters: [ { $ref: '#/components/parameters/groupId' } ], requestBody: { $ref: '#/components/requestBodies/DeviceId' }, responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/device-groups/{groupId}/devices/{deviceId}:
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Remove device group member, parameters: [ { $ref: '#/components/parameters/groupId' }, { $ref: '#/components/parameters/deviceId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/dns/zones:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List DNS zones, parameters: [ { $ref: '#/components/parameters/networkId' } ], responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create DNS zone, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/DNSZone' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/dns/zones/{zoneId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update DNS zone, parameters: [ { $ref: '#/components/parameters/zoneId' } ], requestBody: { $ref: '#/components/requestBodies/DNSZone' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete DNS zone, parameters: [ { $ref: '#/components/parameters/zoneId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/dns/records:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List DNS records, parameters: [ { $ref: '#/components/parameters/networkId' } ], responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create DNS record, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/DNSRecord' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/dns/records/{recordId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update DNS record, parameters: [ { $ref: '#/components/parameters/recordId' } ], requestBody: { $ref: '#/components/requestBodies/DNSRecord' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete DNS record, parameters: [ { $ref: '#/components/parameters/recordId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/networks/{networkId}/security-groups:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List security groups, parameters: [ { $ref: '#/components/parameters/networkId' } ], responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create security group, parameters: [ { $ref: '#/components/parameters/networkId' } ], requestBody: { $ref: '#/components/requestBodies/SecurityGroup' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/security-groups/{securityGroupId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update security group, parameters: [ { $ref: '#/components/parameters/securityGroupId' } ], requestBody: { $ref: '#/components/requestBodies/SecurityGroup' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete security group, parameters: [ { $ref: '#/components/parameters/securityGroupId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }
  /api/ops/security-groups/{securityGroupId}/rules:
    get: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: List security rules, parameters: [ { $ref: '#/components/parameters/securityGroupId' } ], responses: { '200': { $ref: '#/components/responses/Items' } } }
    post: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Create security rule, parameters: [ { $ref: '#/components/parameters/securityGroupId' } ], requestBody: { $ref: '#/components/requestBodies/SecurityRule' }, responses: { '201': { $ref: '#/components/responses/JSON' } } }
  /api/ops/security-rules/{ruleId}:
    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update security rule, parameters: [ { $ref: '#/components/parameters/ruleId' } ], requestBody: { $ref: '#/components/requestBodies/SecurityRule' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }
    delete: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Delete security rule, parameters: [ { $ref: '#/components/parameters/ruleId' } ], responses: { '200': { $ref: '#/components/responses/Status' } } }

components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: DeviceToken
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: OperatorToken
    punchSignature:
      type: apiKey
      in: header
      name: X-Slan-Punch-Signature
      description: Requires X-Slan-Device-ID, X-Slan-MQTT-Username, and md5(deviceId + mqttPassword).
  parameters:
    deviceId: { name: deviceId, in: path, required: true, schema: { type: string } }
    credentialId: { name: credentialId, in: path, required: true, schema: { type: string } }
    networkId: { name: networkId, in: path, required: true, schema: { type: string } }
    groupId: { name: groupId, in: path, required: true, schema: { type: string } }
    zoneId: { name: zoneId, in: path, required: true, schema: { type: string } }
    recordId: { name: recordId, in: path, required: true, schema: { type: string } }
    mappingId: { name: mappingId, in: path, required: true, schema: { type: string } }
    securityGroupId: { name: securityGroupId, in: path, required: true, schema: { type: string } }
    ruleId: { name: ruleId, in: path, required: true, schema: { type: string } }
    keyId: { name: keyId, in: path, required: true, schema: { type: string } }
    operatorId: { name: operatorId, in: path, required: true, schema: { type: string } }
    nodeId: { name: nodeId, in: path, required: true, schema: { type: string } }
    customerId: { name: customerId, in: path, required: true, schema: { type: string } }
  responses:
    JSON:
      description: JSON object response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormObject' }
    Items:
      description: Collection response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemsResponse' }
    AuditItems:
      description: Audit event collection response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuditItemsResponse' }
    Status:
      description: Status response.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
  requestBodies:
    FreeForm:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormObject' }
    ServerNode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, host, sshUsername]
            properties:
              name: { type: string }
              host: { type: string }
              sshPort: { type: integer, minimum: 1, maximum: 65535, default: 22 }
              sshUsername: { type: string }
              sshPassword: { type: string, format: password, writeOnly: true }
              relayUdpPort: { type: integer, minimum: 1, maximum: 65535 }
              relayAdminPort: { type: integer, minimum: 1, maximum: 65535 }
              relayTcpPort: { type: integer, minimum: 1, maximum: 65535 }
              punchUdpPort: { type: integer, minimum: 1, maximum: 65535 }
              punchHttpPort: { type: integer, minimum: 1, maximum: 65535 }
              apiProxyPort: { type: integer, minimum: 1, maximum: 65535 }
              mqttProxyPort: { type: integer, minimum: 1, maximum: 65535 }
              relayEnabled: { type: boolean }
              punchEnabled: { type: boolean }
              proxyEnabled: { type: boolean }
    ServerNodeDeploy:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              sshHostKeyFingerprint: { type: string, description: Required for the first deployment and must match the freshly inspected SSH host key. }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string }
              password: { type: string }
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [oldPassword, newPassword]
            properties:
              oldPassword: { type: string }
              newPassword: { type: string }
    NewPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [newPassword]
            properties:
              newPassword: { type: string }
    DeviceId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [deviceId]
            properties:
              deviceId: { type: string }
    DeviceAuthorizationKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key]
            properties:
              key: { type: string }
              deviceId: { type: string, description: Required when the key is already bound to a device. }
    DeviceSessionRenew:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RuntimeCounters'
              - type: object
                required: [refreshToken]
                properties:
                  refreshToken: { type: string }
    LegacyDeviceRenew:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RuntimeCounters'
    DNSZone:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
    DNSRecord:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              zoneId: { type: string }
              name: { type: string }
              type: { type: string }
              value: { type: string }
              port: { type: string }
              ttl: { type: integer }
    SecurityGroup:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
    SecurityRule:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              direction: { type: string }
              protocol: { type: string }
              portRange: { type: string }
              peerType: { type: string }
              peerValue: { type: string }
              action: { type: string }
              priority: { type: integer }
              description: { type: string }
              enabled: { type: boolean }
    RelayTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [networkId, srcNodeId, dstNodeId]
            properties:
              networkId: { type: string }
              srcNodeId: { type: string }
              dstNodeId: { type: string }
              derpClusterId: { type: string }
              preferredDerpNodeIds: { type: array, items: { type: string } }
              preferredRelayEndpointIds: { type: array, items: { type: string } }
              reason: { type: string }
              relayRegionId: { type: string }
    PunchConnectSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [requesterNodeId, peerNodeId]
            properties:
              requesterNodeId: { type: string }
              peerNodeId: { type: string }
              ttlSeconds: { type: integer }
  schemas:
    FreeFormObject:
      type: object
      additionalProperties: true
    ItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
    AuditItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
    AuditEvent:
      type: object
      required: [eventId, actorType, actorId, action, resourceType, resourceId, status, createdAt]
      properties:
        eventId: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        status: { type: string }
        remoteIp: { type: string }
        detail: { type: string }
        createdAt: { type: integer, format: int64 }
    RuntimeCounters:
      type: object
      properties:
        networkEnabled: { type: boolean }
        rxBytesTotal: { type: integer, format: int64, minimum: 0 }
        txBytesTotal: { type: integer, format: int64, minimum: 0 }
    OpsDeviceUpdate:
      type: object
      properties:
        alias: { type: string }
        status: { type: string }
        enabled: { type: boolean }
