    patch: { tags: [Ops], security: [ { operatorBearer: [] } ], summary: Update renewal, parameters: [ { $ref: '#/components/parameters/renewalId' } ], requestBody: { $ref: '#/components/requestBodies/FreeForm' }, responses: { '200': { $ref: '#/components/responses/JSON' } } }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: UserToken
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: DeviceToken
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: OperatorToken
    punchSignature:
      type: apiKey
      in: header
      name: X-Slan-Punch-Signature
      description: Requires X-Slan-Device-ID, X-Slan-MQTT-Username, and md5(deviceId + mqttPassword).
  parameters:
    userId: { name: userId, in: path, required: true, schema: { type: string } }
    userIdQuery: { name: userId, in: query, required: false, schema: { type: string } }
    deviceId: { name: deviceId, in: path, required: true, schema: { type: string } }
    networkId: { name: networkId, in: path, required: true, schema: { type: string } }
    zoneId: { name: zoneId, in: path, required: true, schema: { type: string } }
    recordId: { name: recordId, in: path, required: true, schema: { type: string } }
    mappingId: { name: mappingId, in: path, required: true, schema: { type: string } }
    securityGroupId: { name: securityGroupId, in: path, required: true, schema: { type: string } }
    ruleId: { name: ruleId, in: path, required: true, schema: { type: string } }
    keyId: { name: keyId, in: path, required: true, schema: { type: string } }
    fileName: { name: fileName, in: path, required: true, schema: { type: string } }
    operatorId: { name: operatorId, in: path, required: true, schema: { type: string } }
    nodeId: { name: nodeId, in: path, required: true, schema: { type: string } }
    customerId: { name: customerId, in: path, required: true, schema: { type: string } }
    downloadId: { name: downloadId, in: path, required: true, schema: { type: string } }
    planCode: { name: planCode, in: path, required: true, schema: { type: string } }
    productId: { name: productId, in: path, required: true, schema: { type: string } }
    orderId: { name: orderId, in: path, required: true, schema: { type: string } }
    renewalId: { name: renewalId, in: path, required: true, schema: { type: string } }
  responses:
    JSON:
      description: JSON object response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormObject' }
    Items:
      description: Collection response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ItemsResponse' }
    Status:
      description: Status response.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
  requestBodies:
    FreeForm:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FreeFormObject' }
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string }
              name: { type: string }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string }
              password: { type: string }
    Logout:
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceToken: { type: string }
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [oldPassword, newPassword]
            properties:
              oldPassword: { type: string }
              newPassword: { type: string }
    NewPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [newPassword]
            properties:
              newPassword: { type: string }
    DeviceId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [deviceId]
            properties:
              deviceId: { type: string }
    UserIdOptional:
      content:
        application/json:
          schema:
            type: object
            properties:
              userId: { type: string }
    LoginKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [loginKey]
            properties:
              loginKey: { type: string }
    CompleteDeviceLogin:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              token: { type: string }
              action: { type: string }
    DeviceIdentity:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeviceIdentity' }
    RegisterDevice:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/DeviceIdentity'
              - type: object
                properties:
                  userId: { type: string }
    BootstrapKey:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [networkId]
            properties:
              userId: { type: string }
              networkId: { type: string }
              deviceAlias: { type: string }
              ttlSeconds: { type: integer, format: int64 }
    DeviceSessionBootstrap:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/DeviceIdentity'
              - type: object
                required: [sessionKey]
                properties:
                  sessionKey: { type: string }
    DeviceSessionRenew:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeCounters' }
    LegacyDeviceRenew:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RuntimeCounters'
              - type: object
                properties:
                  userId: { type: string }
    UpdateDeviceAlias:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              actorUserId: { type: string }
              alias: { type: string }
    UserAlias:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ownerUserId: { type: string }
              email: { type: string }
              alias: { type: string }
    DeviceInvite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ownerUserId: { type: string }
              inviteeEmail: { type: string }
              deviceId: { type: string }
              alias: { type: string }
    AcceptDeviceInvite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              inviteId: { type: string }
              userId: { type: string }
              alias: { type: string }
    CreateNetwork:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ownerUserId: { type: string }
              name: { type: string }
              code: { type: string }
              templateKey: { type: string }
    UpdateNetwork:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              code: { type: string }
              status: { type: string }
    AddNetworkDevice:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceId: { type: string }
              ownerUserId: { type: string }
              alias: { type: string }
              role: { type: string }
              enabled: { type: boolean }
    UpdateNetworkDevice:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              alias: { type: string }
              role: { type: string }
              enabled: { type: boolean }
    DNSZone:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              zoneName: { type: string }
              exposeGlobal: { type: boolean }
    DNSRecord:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              zoneId: { type: string }
              name: { type: string }
              recordType: { type: string }
              targetDeviceId: { type: string }
              targetIp: { type: string }
              cname: { type: string }
              port: { type: string }
              ttl: { type: integer }
    PublicMapping:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              alias: { type: string }
              publicDomain: { type: string }
              sourceRecord: { type: string }
              deviceId: { type: string }
              protocol: { type: string }
              port: { type: string }
              externalPort: { type: string }
              status: { type: string }
    SecurityGroup:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
    SecurityRule:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              direction: { type: string }
              priority: { type: integer }
              action: { type: string }
              protocol: { type: string }
              portFrom: { type: integer }
              portTo: { type: integer }
              peerType: { type: string }
              peerValue: { type: string }
              description: { type: string }
              enabled: { type: boolean }
    RelayTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [networkId, srcNodeId, dstNodeId]
            properties:
              networkId: { type: string }
              srcNodeId: { type: string }
              dstNodeId: { type: string }
              derpClusterId: { type: string }
              preferredDerpNodeIds: { type: array, items: { type: string } }
              preferredRelayEndpointIds: { type: array, items: { type: string } }
              reason: { type: string }
              relayRegionId: { type: string }
    PunchConnectSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [requesterNodeId, peerNodeId]
            properties:
              requesterNodeId: { type: string }
              peerNodeId: { type: string }
              ttlSeconds: { type: integer }
    PunchNode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, publicUdpIp, publicUdpPort]
            properties:
              name: { type: string }
              region: { type: string }
              publicUdpIp: { type: string }
              publicUdpPort: { type: integer }
              maxSessions: { type: integer }
              status: { type: string }
              health: { type: string }
              priority: { type: integer }
    AssignPlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [planCode]
            properties:
              planCode: { type: string }
              expiresAt: { type: integer, format: int64 }
              amount: { type: number }
              period: { type: string }
  schemas:
    FreeFormObject:
      type: object
      additionalProperties: true
    ItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
    DeviceIdentity:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
        name: { type: string }
        platform: { type: string }
        osName: { type: string }
        osVersion: { type: string }
        alias: { type: string }
        publicKey: { type: string }
    RuntimeCounters:
      type: object
      properties:
        networkEnabled: { type: boolean }
        rxBytesTotal: { type: integer, format: int64, minimum: 0 }
        txBytesTotal: { type: integer, format: int64, minimum: 0 }
    ClientDownloadUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        platform: { type: string }
        version: { type: string }
        channel: { type: string }
        arch: { type: string }
        releaseNotes: { type: string }
        status: { type: string }
    OpsDeviceUpdate:
      type: object
      properties:
        alias: { type: string }
        status: { type: string }
        enabled: { type: boolean }
