<section class="detail-card" *ngIf="vm.workspacePanel === 'devices'">
  <div class="section-title">
    <div>
      <h3>网络设备</h3>
      <p>设备由当前网络引用的设备分组自动展开；请在“设备分组”中调整网络引用。</p>
    </div>
  </div>
  <div class="rules-table-wrap">
    <table class="compact-table network-devices-table">
      <colgroup>
        <col class="device-id-column" />
        <col class="owner-column" />
        <col class="alias-column" />
        <col class="ip-column" />
        <col class="status-column" />
        <col class="action-column" />
      </colgroup>
      <thead><tr><th>设备</th><th>归属</th><th>别名</th><th>IP</th><th>状态</th></tr></thead>
      <tbody>
        <tr *ngFor="let device of vm.workspaceDevices">
          <td class="device-id-cell">
            <button class="text-link" type="button" [title]="'查看设备: ' + (device.alias || device.deviceId)" aria-label="查看设备详情" (click)="vm.openDeviceExposureDialog(device)">查看详情</button>
            <strong>{{ device.alias || device.deviceId }}</strong>
            <code>{{ device.deviceId }}</code>
          </td>
          <td>{{ vm.workspaceDeviceOwnerLabel(device) }}</td>
          <td>{{ device.alias || '-' }}</td>
          <td><code>{{ device.ip }}</code></td>
          <td><span class="status" [class.online]="device.status === 'active'">{{ device.status }}</span></td>
        </tr>
        <tr *ngIf="vm.workspaceDevices.length === 0"><td colspan="5">暂无设备，请先为网络引用一个包含设备的分组。</td></tr>
      </tbody>
    </table>
  </div>
</section>
