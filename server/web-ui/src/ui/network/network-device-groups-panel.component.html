<section class="detail-card" *ngIf="vm.workspacePanel === 'deviceGroups'">
  <div class="section-title">
    <div>
      <h3>设备分组</h3>
      <p>网络只引用设备管理中已有的分组；分组成员变化会自动同步到当前网络。</p>
    </div>
    <div class="table-actions">
      <select [(ngModel)]="vm.selectedWorkspaceDeviceGroupReferenceId" aria-label="选择设备分组">
        <option value="">选择要引用的分组</option>
        <option *ngFor="let group of vm.availableWorkspaceDeviceGroupReferences" [value]="group.groupId">{{ group.name }}</option>
      </select>
      <button class="table-icon-button" type="button" title="引用分组" aria-label="引用分组" [disabled]="!vm.selectedWorkspaceDeviceGroupReferenceId" (click)="vm.addWorkspaceDeviceGroupReference()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      </button>
    </div>
  </div>
  <p class="form-error" *ngIf="vm.deviceListMessage">{{ vm.deviceListMessage }}</p>
  <div class="rules-table-wrap">
    <table class="compact-table">
      <thead><tr><th>分组名称</th><th>描述</th><th>当前网络设备数</th><th>当前网络设备</th><th>操作</th></tr></thead>
      <tbody>
        <tr *ngFor="let group of vm.workspaceDeviceGroups">
          <td><strong>{{ group.name }}</strong></td>
          <td>{{ group.description || '-' }}</td>
          <td>{{ vm.workspaceDeviceGroupCount(group.groupId) }}</td>
          <td>{{ vm.workspaceDeviceNamesInGroup(group.groupId) }}</td>
          <td class="table-actions">
            <button class="table-icon-button danger" type="button" title="取消引用" aria-label="取消引用" (click)="vm.removeWorkspaceDeviceGroupReference(group)">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16"></path>
                <path d="M9 7V5h6v2"></path>
                <path d="M8 7l1 12h6l1-12"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="vm.workspaceDeviceGroups.length === 0">
          <td colspan="5">当前网络尚未引用设备分组。</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
