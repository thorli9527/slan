<section class="page">
  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>用户别名管理</h2>
        <p>为接入用户邮箱设置别名；其它界面优先显示别名，不再显示邮箱。</p>
      </div>
    </div>
    <table>
      <thead><tr><th>用户邮箱</th><th>显示别名</th><th>操作</th></tr></thead>
      <tbody>
        <tr *ngFor="let user of vm.managedUserAliases">
          <td><code>{{ user.email }}</code></td>
          <td class="tag-cell-wrapper">
            <div class="alias-tag-cell">
              <span>{{ user.alias || user.email }}</span>
              <button class="tag-icon-button" type="button" title="修改别名" (click)="vm.openUserAliasDialog(user)">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 13.2 13.2 20a2 2 0 0 1-2.8 0L4 13.6V4h9.6L20 10.4a2 2 0 0 1 0 2.8Z"></path>
                  <circle cx="8.5" cy="8.5" r="1.4"></circle>
                </svg>
              </button>
              <div class="tag-popover" *ngIf="vm.showUserAliasDialog && vm.editingUserAlias?.email === user.email">
                <div class="tag-popover-arrow"></div>
                <div class="tag-editor-row">
                  <span>别名</span>
                  <input [(ngModel)]="vm.userAliasValue" />
                </div>
                <div class="tag-popover-actions">
                  <button class="text-link" type="button" (click)="vm.saveUserAliasDialog()">保存</button>
                  <button class="text-link muted" type="button" (click)="vm.closeUserAliasDialog()">取消</button>
                </div>
              </div>
            </div>
          </td>
          <td>
            <button class="table-icon-button" type="button" title="编辑别名" aria-label="编辑别名" (click)="vm.openUserAliasDialog(user)">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4l10-10-4-4L4 16v4"></path>
                <path d="M13 7l4 4"></path>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="vm.managedUserAliases.length === 0">
          <td colspan="3">暂无用户别名，接入其他用户后可以在这里统一设置显示名称。</td>
        </tr>
      </tbody>
    </table>
  </article>
</section>
