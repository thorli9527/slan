# server-biz 本地开发配置样例。
#
# 该文件用于说明控制面服务在本地运行时需要的核心配置项。
http:
  # 对外客户 HTTP API 监听地址。
  address: ":8080"
  # 运营管理 HTTP API 监听地址。
  ops_address: ":8081"
  # 客户端生成 control-plane WSURL 时使用的公网可访问地址。
  public_host: "127.0.0.1:8080"
  # 客户端访问控制面的外部协议；生产环境通常应为 https。
  public_scheme: "http"
ws:
  # 控制通道 WebSocket 路径。
  path: "/control/ws"
jwt:
  # JWT 签发者标识。
  issuer: "slan"
  # JWT 签名密钥，生产环境应替换。
  secret: "change-me"
relay:
  # 默认 relay 集群。
  default_cluster_id: "cn-local-a"
  # relay ticket HMAC 签名密钥，生产环境必须替换。
  ticket_signing_secret: "change-me-relay-ticket-secret"
  # 四层 relay 拓扑：国家 -> 城市 -> 集群 -> 节点。
  countries:
    - country_code: "CN"
      country_name: "China"
      cities:
        - city_code: "local"
          city_name: "Local"
          clusters:
            - cluster_id: "cn-local-a"
              cluster_name: "CN Local A"
              nodes:
                - node_id: "relay-cn-local-udp"
                  transport: "udp"
                  address: "127.0.0.1:9000"
                  priority: 10
                - node_id: "relay-cn-local-tcp"
                  transport: "tcp"
                  address: "127.0.0.1:9001"
                  priority: 20
bootstrap:
  # Bootstrap 返回的默认 STUN 列表。
  stun_servers:
    - "stun:stun.l.google.com:19302"
auth:
  # Access token TTL in seconds.
  access_token_ttl_seconds: 3600
  # Refresh token TTL in seconds.
  refresh_token_ttl_seconds: 86400
ops:
  # 运营入口静态令牌，生产环境必须替换。
  access_token: "change-me-ops-token"
  login_rate_limit:
    # 默认启用；只有显式设为 true 才关闭。
    disabled: false
    window_seconds: 60
    ip_limit: 10
    ip_login_name_limit: 5
    login_name_limit: 20
  # 管理员账号通过 /login 换取动态 ops token；静态令牌仍保留给内网运维或应急访问。
  default_admin:
    # 是否在首次启动时自动灌入默认管理员。
    enabled: true
    # 默认管理员绑定的业务用户邮箱。
    email: "admin@local.slan"
    # 默认管理员初始密码，生产环境必须替换。
    password: "change-me-admin-password"
    # 默认管理员登录名。
    login_name: "admin"
    # 默认管理员显示名称。
    display_name: "Default Admin"
postgres:
  # PostgreSQL 主机。
  host: "127.0.0.1"
  # PostgreSQL 端口。
  port: 5432
  # 数据库名。
  database: "slan"
  # 数据库用户名。
  username: "postgres"
  # 数据库密码。
  password: "123456"
  # 本地开发关闭 SSL。
  ssl_mode: "disable"
  # 最大连接数。
  max_open_conns: 10
  # 最小空闲连接数。
  min_idle_conns: 2
  # 连接最大存活时间，单位秒。
  conn_max_lifetime_seconds: 1800
  # 连接最大空闲时间，单位秒。
  conn_max_idle_time_seconds: 300
redis:
  # Redis 主机。
  host: "127.0.0.1"
  # Redis 端口。
  port: 6379
  # Redis 密码，空表示不启用密码。
  password: ""
  # Redis 库编号。
  database: 1
  # 连接池大小。
  pool_size: 10
  # 最小空闲连接数。
  min_idle_conns: 2
  # Redis 建连超时时间，单位秒。
  dial_timeout_seconds: 5
  # Redis 读超时时间，单位秒。
  read_timeout_seconds: 3
  # Redis 写超时时间，单位秒。
  write_timeout_seconds: 3
