<section class="page">
  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>订单管理</h2>
        <p>订单记录客户购买商品、支付状态、开通状态和有效期。</p>
      </div>
      <button class="primary" type="button" (click)="vm.openOrderDialog()">创建订单</button>
    </div>
    <table>
      <thead><tr><th>订单号</th><th>客户</th><th>商品</th><th>类型</th><th>金额</th><th>支付状态</th><th>开通状态</th><th>创建时间</th><th>有效期</th><th>渠道</th></tr></thead>
      <tbody>
        <tr *ngFor="let order of vm.orders">
          <td><code>{{ order.orderId }}</code></td>
          <td><code>{{ order.customerEmail }}</code></td>
          <td><strong>{{ order.productName }}</strong></td>
          <td>{{ order.productType }}</td>
          <td>{{ order.amount }} 元</td>
          <td><span class="status" [class.online]="order.payStatus === 'paid'">{{ order.payStatus }}</span></td>
          <td><span class="status" [class.online]="order.provisionStatus === 'provisioned'">{{ order.provisionStatus }}</span></td>
          <td>{{ order.createdAt }}</td>
          <td>{{ order.validUntil || '-' }}</td>
          <td>{{ order.channel }}</td>
        </tr>
      </tbody>
    </table>
  </article>
</section>
