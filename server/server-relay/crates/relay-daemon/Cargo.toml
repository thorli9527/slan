[package]
name = "relay-daemon"
edition.workspace = true
version.workspace = true

[[bin]]
name = "server-relay"
path = "src/main.rs"

[dependencies]
auth = { path = "../auth" }
base64 = "0.22"
hmac = "0.12"
relay-core = { path = "../relay-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
session = { path = "../session" }
sha2 = "0.10"
udp-relay = { path = "../udp-relay" }

[dev-dependencies]
client-core = { path = "../../../../client_v2/rust/crates/client-core" }
