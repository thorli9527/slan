<section class="page">
  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>客户管理</h2>
        <p>查看客户基础资料、Relay 用量和状态。</p>
      </div>
      <button class="primary" type="button" (click)="vm.openCustomerDialog()">新增客户</button>
    </div>
    <table>
      <thead><tr><th>客户</th><th>地域</th><th>Relay 已用流量</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr *ngFor="let customer of pagedCustomers">
          <td><strong>{{ customer.name }}</strong><br><code>{{ customer.email }}</code></td>
          <td>{{ customer.country }} {{ customer.province }} {{ customer.city }}</td>
          <td>{{ customer.relayUsedGb }}GB</td>
          <td><span class="status" [class.online]="customer.status === 'active'">{{ customer.status }}</span></td>
          <td>
            <div class="row-actions">
              <button class="table-icon-button" type="button" title="查看或修改客户" aria-label="查看或修改客户" (click)="vm.openCustomerDialog(customer)">
                <svg class="icon-inline" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.013 1.427a2 2 0 0 1 2.828 2.828l-7.28 7.28-3.3.472.471-3.3 7.281-7.28Zm1.414 1.414a1 1 0 0 0-1.414 0L4.675 9.18l-.236 1.65 1.65-.236 6.338-6.339a1 1 0 0 0 0-1.414Z"/></svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="vm.customers.length === 0">
          <td colspan="5" class="empty-cell">暂无客户。</td>
        </tr>
      </tbody>
    </table>
    <ops-pagination [total]="vm.customers.length" [page]="page" [pageSize]="pageSize" (pageChange)="page = $event" (pageSizeChange)="pageSize = $event; resetPage()"></ops-pagination>
  </article>
</section>
