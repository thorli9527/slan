<section class="page">
  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>客户续费管理</h2>
        <p>记录客户续费、手动开通、有效期调整和操作人。</p>
      </div>
      <button class="primary" type="button" [disabled]="vm.customers.length === 0" (click)="vm.openAssignPlan(vm.customers[0])">手动续费</button>
    </div>
    <table>
      <thead><tr><th>客户</th><th>套餐</th><th>周期</th><th>金额</th><th>支付时间</th><th>有效期至</th><th>来源</th><th>操作人</th><th>操作</th></tr></thead>
      <tbody>
        <tr *ngFor="let renewal of vm.renewals">
          <td><code>{{ renewal.customerEmail }}</code></td>
          <td>{{ vm.planName(renewal.planCode) }}</td>
          <td>{{ renewal.period }}</td>
          <td>{{ renewal.amount }} 元</td>
          <td>{{ renewal.paidAt }}</td>
          <td>{{ renewal.validUntil }}</td>
          <td>{{ renewal.source }}</td>
          <td><code>{{ renewal.operator }}</code></td>
          <td>
            <button class="table-icon-button" type="button" title="查看或修改续费记录" aria-label="查看或修改续费记录" (click)="vm.openRenewalDialog(renewal)">
              <svg class="icon-inline" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.013 1.427a2 2 0 0 1 2.828 2.828l-7.28 7.28-3.3.472.471-3.3 7.281-7.28Zm1.414 1.414a1 1 0 0 0-1.414 0L4.675 9.18l-.236 1.65 1.65-.236 6.338-6.339a1 1 0 0 0 0-1.414Z"/></svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="vm.renewals.length === 0">
          <td colspan="9" class="empty-cell">暂无续费记录。</td>
        </tr>
      </tbody>
    </table>
  </article>
</section>
