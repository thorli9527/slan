<section class="page">

  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>客户地址统计</h2>
        <p>按客户归属地和 IP 区域统计分布，用于运营和中继节点规划。</p>
      </div>
    </div>
    <div class="address-grid">
      <div>
        <h3>城市分布</h3>
        <div class="stat-row" *ngFor="let item of vm.addressStats">
          <span>{{ item.label }}</span>
          <strong>{{ item.count }}</strong>
          <div class="meter"><span [style.width.%]="item.percent"></span></div>
        </div>
      </div>
      <div>
        <h3>区域分布</h3>
        <div class="stat-row" *ngFor="let item of vm.regionStats">
          <span>{{ item.label }}</span>
          <strong>{{ item.count }}</strong>
          <div class="meter"><span [style.width.%]="item.percent"></span></div>
        </div>
      </div>
    </div>
  </article>

  <article class="panel">
    <div class="panel-title">
      <div>
        <h2>待处理事项</h2>
        <p>聚合显示节点容量和客户状态。</p>
      </div>
    </div>
    <div class="todo-grid">
      <div><strong>{{ vm.limitedCustomers }}</strong><span>客户 Relay 超限</span></div>
      <div><strong>{{ vm.relayNodes.length - vm.activeRelayNodes }}</strong><span>节点非 active</span></div>
    </div>
  </article>

</section>
